<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Munich Zone M Transit GPS Map</title>
  <meta name="theme-color" content="#0B0E14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #EAF0F8;
    }

    :root {
      /* Luminous Liquid Glass Theme */
      --aicher-bg: #EAF0F8;
      --glass-base: rgba(255, 255, 255, 0.65);
      --glass-base-solid: #FFFFFF;
      --glass-panel-sub: rgba(244, 248, 255, 0.50);
      --glass-border: rgba(255, 255, 255, 0.88);
      --glass-border-focus: rgba(255, 255, 255, 0.95);
      --glass-specular: rgba(255, 255, 255, 0.98);
      --glass-specular-soft: rgba(255, 255, 255, 0.55);
      --glass-blur: blur(28px) saturate(210%);
      --glass-shadow: 0 20px 48px -10px rgba(0, 85, 185, 0.16), 0 8px 24px -4px rgba(15, 23, 42, 0.06);
      --glass-btn-hover-shadow: 0 14px 32px -4px rgba(0, 102, 204, 0.28);
      --aicher-blue: #0066CC;
      --aicher-yellow: #FFB800;
      --aicher-green: #00A35C;
      --aicher-text-title: #0F172A;
      --aicher-text-main: #1E293B;
      --aicher-text-muted: #5B6E88;
      --aicher-radius: 28px;
      --aicher-radius-pill: 9999px;
      --spring-bouncy: cubic-bezier(0.34, 1.68, 0.64, 1);
      --spring-squish: cubic-bezier(0.175, 0.885, 0.32, 1.45);
      --spring-soft: cubic-bezier(0.25, 1.25, 0.5, 1);
    }

    body.theme-dark {
      --aicher-bg: #0B0E14;
      --glass-base: rgba(18, 24, 36, 0.68);
      --glass-base-solid: #121824;
      --glass-panel-sub: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.16);
      --glass-border-focus: rgba(255, 255, 255, 0.28);
      --glass-specular: rgba(255, 255, 255, 0.35);
      --glass-specular-soft: rgba(255, 255, 255, 0.15);
      --glass-shadow: 0 20px 50px -8px rgba(0, 0, 0, 0.75), 0 6px 18px rgba(0, 0, 0, 0.4);
      --glass-btn-hover-shadow: 0 12px 30px -4px rgba(0, 0, 0, 0.5);
      --aicher-blue: #1A84ED;
      --aicher-yellow: #FFD200;
      --aicher-green: #00B368;
      --aicher-text-title: #FFFFFF;
      --aicher-text-main: #E5EBF5;
      --aicher-text-muted: #94A3B8;
    }

    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Univers", "SF Pro Display", "Helvetica Neue", "Arial", sans-serif;
      overscroll-behavior: none;
      background-color: var(--aicher-bg);
      color: var(--aicher-text-main);
      letter-spacing: -0.015em;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    #map {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--aicher-bg);
      z-index: 1;
      touch-action: manipulation;
    }

    .aicher-panel {
      position: relative;
      background: linear-gradient(135deg, var(--glass-base) 0%, rgba(255, 255, 255, 0.54) 100%);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1.5px solid var(--glass-border);
      border-radius: var(--aicher-radius);
      box-shadow: inset 0 2px 2px 0 var(--glass-specular),
                  inset 0 -2px 3px 0 rgba(0, 0, 0, 0.03),
                  var(--glass-shadow);
      transition: transform 0.42s var(--spring-bouncy),
                  box-shadow 0.35s ease,
                  background 0.35s ease,
                  border-color 0.3s ease;
    }

    body.theme-dark .aicher-panel {
      background: linear-gradient(135deg, var(--glass-base) 0%, rgba(25, 33, 49, 0.68) 100%);
      box-shadow: inset 0 1.5px 2px 0 var(--glass-specular),
                  inset 0 -2px 3px 0 rgba(0, 0, 0, 0.3),
                  var(--glass-shadow);
    }

    .aicher-panel::before {
      content: '';
      position: absolute;
      top: 0;
      left: 14px;
      right: 14px;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, var(--glass-specular) 45%, var(--glass-specular) 55%, transparent 100%);
      opacity: 0.85;
      pointer-events: none;
      border-radius: inherit;
    }

    .aicher-btn {
      position: relative;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 0;
      margin: 0;
      background: linear-gradient(135deg, var(--glass-base) 0%, rgba(255, 255, 255, 0.54) 100%);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1.5px solid var(--glass-border);
      border-radius: 14px;
      color: var(--aicher-text-title);
      box-shadow: inset 0 1.5px 2px 0 var(--glass-specular),
                  inset 0 -1px 1.5px 0 rgba(0, 0, 0, 0.04),
                  var(--glass-shadow);
      transition: transform 0.28s var(--spring-bouncy),
                  box-shadow 0.25s ease,
                  background-color 0.2s ease,
                  border-color 0.2s ease;
      touch-action: manipulation;
      will-change: transform;
      line-height: 1 !important;
      text-align: center !important;
    }

    body.theme-dark .aicher-btn {
      background: linear-gradient(135deg, var(--glass-base) 0%, rgba(25, 33, 49, 0.68) 100%);
      box-shadow: inset 0 1.5px 2px 0 var(--glass-specular),
                  inset 0 -2px 3px 0 rgba(0, 0, 0, 0.3),
                  var(--glass-shadow);
    }

    .aicher-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 16%;
      right: 16%;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, var(--glass-specular) 50%, transparent 100%);
      opacity: 0.9;
      pointer-events: none;
      border-radius: inherit;
    }

    button i, .aicher-btn i,
    button span, .aicher-btn span,
    [class*="fa-"] {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      vertical-align: 0 !important;
      line-height: 1 !important;
      margin: 0 !important;
      padding: 0 !important;
      text-align: center !important;
      transform-origin: center center;
    }

    .aicher-btn:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: inset 0 1.5px 2px 0 var(--glass-specular),
                  var(--glass-btn-hover-shadow);
      border-color: var(--glass-border-focus);
    }

    button:focus, button:focus-visible,
    .aicher-btn:focus, .aicher-btn:focus-visible,
    input:focus, input:focus-visible {
      outline: none !important;
      border-color: var(--glass-border) !important;
      box-shadow: none !important;
      -webkit-tap-highlight-color: transparent !important;
    }

    body.theme-dark button:focus,
    body.theme-dark button:focus-visible,
    body.theme-dark .aicher-btn:focus,
    body.theme-dark .aicher-btn:focus-visible {
      outline: none !important;
      border-color: var(--glass-border) !important;
    }

    body.theme-dark .aicher-btn:hover {
      border-color: var(--glass-border) !important;
      box-shadow: inset 0 1.5px 2px 0 var(--glass-specular),
                  0 8px 20px -2px rgba(0, 0, 0, 0.5) !important;
    }

    .aicher-btn:active {
      transform: scale(0.88, 0.85) translateY(1px);
      box-shadow: inset 0 1px 1px 0 var(--glass-specular),
                  0 2px 8px rgba(0, 70, 160, 0.2);
      transition: transform 0.12s var(--spring-squish);
    }

    .aicher-search-bar {
      position: relative;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.88) 0%, rgba(240, 245, 255, 0.82) 100%);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1.5px solid var(--glass-border);
      border-radius: 22px;
      box-shadow: inset 0 2px 2.5px 0 var(--glass-specular),
                  inset 0 -1.5px 2px 0 rgba(0, 0, 0, 0.04),
                  var(--glass-shadow);
      transition: transform 0.38s var(--spring-bouncy),
                  box-shadow 0.35s ease,
                  border-color 0.3s ease;
    }

    body.theme-dark .aicher-search-bar {
      background: linear-gradient(135deg, rgba(20, 27, 40, 0.90) 0%, rgba(14, 19, 29, 0.86) 100%);
      box-shadow: inset 0 1.5px 2px 0 var(--glass-specular),
                  inset 0 -2px 3px 0 rgba(0, 0, 0, 0.3),
                  var(--glass-shadow);
    }

    .aicher-bottom-shelf {
      position: relative;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.93) 0%, rgba(242, 247, 255, 0.90) 100%);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1.5px solid var(--glass-border);
      border-radius: 22px;
      box-shadow: inset 0 2px 2.5px 0 var(--glass-specular),
                  inset 0 -1.5px 2px 0 rgba(0, 0, 0, 0.04),
                  var(--glass-shadow);
    }

    body.theme-dark .aicher-bottom-shelf {
      background: linear-gradient(135deg, rgba(20, 27, 40, 0.95) 0%, rgba(13, 18, 28, 0.93) 100%);
      box-shadow: inset 0 1.5px 2px 0 var(--glass-specular),
                  inset 0 -2px 3px 0 rgba(0, 0, 0, 0.35),
                  var(--glass-shadow);
    }

    .aicher-search-bar::before,
    .aicher-bottom-shelf::before {
      content: '';
      position: absolute;
      top: 0;
      left: 18px;
      right: 18px;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, var(--glass-specular) 45%, var(--glass-specular) 55%, transparent 100%);
      opacity: 0.9;
      pointer-events: none;
      border-radius: inherit;
    }

    .aicher-filter-tab {
      position: relative;
      background: var(--glass-panel-sub);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1.5px solid var(--glass-border);
      border-radius: var(--aicher-radius-pill);
      color: var(--aicher-text-main);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      box-shadow: inset 0 1.5px 1.5px var(--glass-specular), 0 3px 10px rgba(0, 50, 120, 0.08);
      transition: all 0.36s var(--spring-bouncy);
      will-change: transform;
    }

    .aicher-filter-tab:hover {
      transform: translateY(-2px) scale(1.05);
    }

    .aicher-filter-tab:active {
      transform: scale(0.88, 0.84);
      transition: transform 0.1s var(--spring-squish);
    }

    .aicher-filter-tab.active-tab {
      background: var(--aicher-blue) !important;
      border-color: rgba(255, 255, 255, 0.6) !important;
      color: #FFFFFF !important;
      box-shadow: inset 0 1.5px 2px rgba(255, 255, 255, 0.6),
                  0 8px 22px rgba(0, 102, 204, 0.42);
      transform: scale(1.04);
    }

    .aicher-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      border-radius: var(--aicher-radius-pill);
      min-width: 30px;
      height: 22px;
      padding: 0 8px;
      letter-spacing: -0.02em;
      line-height: 1;
      box-shadow: inset 0 1.5px 2px rgba(255, 255, 255, 0.55),
                  0 4px 10px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.35);
      transition: transform 0.32s var(--spring-bouncy), box-shadow 0.25s ease;
      will-change: transform;
    }

    .aicher-badge:hover {
      transform: scale(1.12, 1.08) translateY(-1.5px);
    }

    @keyframes liquidGlassPop {
      0% { opacity: 0; transform: scale(0.78, 0.72) translateY(14px); }
      55% { opacity: 1; transform: scale(1.07, 1.05) translateY(-3px); }
      80% { transform: scale(0.97, 0.98) translateY(1px); }
      100% { opacity: 1; transform: scale(1, 1) translateY(0); }
    }

    .liquid-pop-in {
      animation: liquidGlassPop 0.48s var(--spring-bouncy) forwards;
    }

    .leaflet-popup { margin-bottom: 8px !important; }
    .leaflet-popup-content-wrapper {
      background: linear-gradient(135deg, var(--glass-base) 0%, rgba(255, 255, 255, 0.6) 100%) !important;
      color: var(--aicher-text-main) !important;
      backdrop-filter: var(--glass-blur) !important;
      -webkit-backdrop-filter: var(--glass-blur) !important;
      border: 1.5px solid var(--glass-border) !important;
      border-radius: 20px !important;
      box-shadow: inset 0 2px 2px var(--glass-specular),
                  0 16px 36px -6px rgba(0, 70, 160, 0.25) !important;
      padding: 0px !important;
      animation: liquidGlassPop 0.45s var(--spring-bouncy) !important;
      transform-origin: bottom center !important;
    }

    body.theme-dark .leaflet-popup-content-wrapper {
      background: linear-gradient(135deg, var(--glass-base) 0%, rgba(22, 29, 44, 0.75) 100%) !important;
      box-shadow: inset 0 1.5px 2px var(--glass-specular),
                  0 16px 36px -6px rgba(0, 0, 0, 0.7) !important;
    }

    .leaflet-popup-content { margin: 0px !important; line-height: 1 !important; }
    .leaflet-popup-tip-container {
      width: 24px !important; height: 9px !important;
      margin-top: -1px !important; margin-left: -12px !important;
    }

    .leaflet-popup-tip {
      width: 10px !important; height: 10px !important;
      margin: -5px auto 0 !important;
      background: var(--glass-base) !important;
      backdrop-filter: var(--glass-blur) !important;
      -webkit-backdrop-filter: var(--glass-blur) !important;
      border: 1.5px solid var(--glass-border) !important;
      border-top: none !important; border-left: none !important;
      box-shadow: none !important;
    }
    .leaflet-container a.leaflet-popup-close-button { display: none !important; }

    .station-node-wrap.leaflet-div-icon, .station-node-wrap {
      background: transparent !important; border: none !important;
      display: flex !important; align-items: center !important; justify-content: center !important;
      transition: transform 0.3s var(--spring-bouncy);
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.45));
    }
    .station-node-wrap:hover {
      transform: scale(1.22);
      filter: drop-shadow(0 3px 10px rgba(0, 0, 0, 0.6));
    }

    .station-node-svg circle.node-outer {
      fill: #FFFFFF; stroke: #0F172A; stroke-width: 2.2px;
    }
    .station-hub-svg circle.hub-outer {
      fill: #FFFFFF; stroke: #0F172A; stroke-width: 2.4px;
    }
    .station-hub-svg circle.hub-inner {
      fill: #0F172A;
    }

    body.theme-dark .station-node-wrap {
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.9));
    }
    body.theme-dark .station-node-svg circle.node-outer {
      fill: #FFFFFF; stroke: #05070B; stroke-width: 2.4px;
    }
    body.theme-dark .station-hub-svg circle.hub-outer {
      fill: #FFFFFF; stroke: #05070B; stroke-width: 2.6px;
    }
    body.theme-dark .station-hub-svg circle.hub-inner {
      fill: #05070B;
    }

    .aicher-gps-marker-wrap.leaflet-div-icon { background: transparent !important; border: none !important; }
    .aicher-gps-wrap { position: relative; width: 32px; height: 32px; }
    .aicher-gps-dot {
      width: 16px; height: 16px; background: var(--aicher-blue); border: 3px solid #FFFFFF;
      border-radius: 50%; position: absolute; top: 8px; left: 8px;
      box-shadow: 0 4px 14px rgba(0, 102, 204, 0.8), inset 0 1px 2px rgba(255, 255, 255, 0.8);
      animation: jellyPulse 3s infinite var(--spring-bouncy);
    }
    .aicher-gps-ring {
      position: absolute; inset: 0px; border: 2px solid rgba(255, 255, 255, 0.75); border-radius: 50%;
      opacity: 0.85; animation: aicherPing 2.2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    @keyframes aicherPing { 75%, 100% { transform: scale(2.8); opacity: 0; } }
    @keyframes jellyPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15, 0.9); }
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .dep-scroll::-webkit-scrollbar { width: 5px; }
    .dep-scroll::-webkit-scrollbar-track { background: transparent; }
    .dep-scroll::-webkit-scrollbar-thumb {
      background: var(--glass-border);
      border-radius: 9999px;
      border: 1px solid var(--glass-specular-soft);
      transition: background 0.25s ease;
    }
    .dep-scroll::-webkit-scrollbar-thumb:hover { background: var(--aicher-blue); }

    .line-scroll::-webkit-scrollbar { height: 4px; }
    .line-scroll::-webkit-scrollbar-track { background: transparent; }
    .line-scroll::-webkit-scrollbar-thumb {
      background: var(--glass-border);
      border-radius: 9999px;
      transition: background 0.25s ease;
    }
    .line-scroll::-webkit-scrollbar-thumb:hover { background: var(--aicher-blue); }

    .safe-top { padding-top: max(14px, env(safe-area-inset-top, 14px)); }
    .safe-bottom { padding-bottom: max(16px, env(safe-area-inset-bottom, 16px)); }

    .departures-drawer {
      max-height: 520px;
      opacity: 1;
      padding-top: 0.5rem;
      margin-top: 0.2rem;
      border-top-width: 1px;
      border-top-color: var(--glass-border);
      pointer-events: auto;
      overflow: hidden;
      transform-origin: bottom center;
    }

    /* Regulated Departure Table Container with Shared Glass Transparency */
    .dep-table-container {
      position: relative;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      box-shadow: inset 0 1px 1.5px 0 var(--glass-specular-soft);
      overflow: hidden;
      width: 100%;
    }

    body.theme-dark .dep-table-container {
      background: rgba(0, 0, 0, 0.22);
      box-shadow: inset 0 1px 1.5px 0 rgba(255, 255, 255, 0.06);
    }

    .dep-table-header {
      background: rgba(0, 0, 0, 0.035);
      border-bottom: 1px solid var(--glass-border);
      user-select: none;
    }

    body.theme-dark .dep-table-header {
      background: rgba(255, 255, 255, 0.035);
    }

    #departuresList {
      transition: max-height 0.38s cubic-bezier(0.25, 1.15, 0.5, 1);
      will-change: max-height;
    }
    #departuresList.is-collapsed {
      max-height: 84px;
      overflow-y: hidden;
    }
    #departuresList.is-expanded {
      max-height: 294px;
      overflow-y: auto;
    }

    .dep-table-row {
      height: 42px;
      min-height: 42px;
      max-height: 42px;
      transition: background-color 0.18s ease;
      will-change: background-color;
    }

    .dep-table-row:hover {
      background-color: rgba(0, 102, 204, 0.06);
    }

    body.theme-dark .dep-table-row:hover {
      background-color: rgba(255, 255, 255, 0.05);
    }

    .dep-table-row:active {
      background-color: rgba(0, 102, 204, 0.12);
    }

    body.theme-dark .dep-table-row:active {
      background-color: rgba(255, 255, 255, 0.08);
    }

    /* Draggable Handle Bar Styles */
    #stationDragHandle {
      cursor: grab;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #stationDragHandle:active,
    #stationDragHandle.is-dragging {
      cursor: grabbing !important;
    }

    #dragHandlePill {
      background-color: rgba(148, 163, 184, 0.45);
      box-shadow: inset 0 1px 1.5px var(--glass-specular),
                  0 2px 5px rgba(0, 0, 0, 0.08);
      transition: width 0.28s cubic-bezier(0.34, 1.4, 0.64, 1),
                  transform 0.28s cubic-bezier(0.34, 1.4, 0.64, 1),
                  background-color 0.2s ease,
                  box-shadow 0.2s ease;
      will-change: width, transform, background-color;
    }

    body.theme-dark #dragHandlePill {
      background-color: rgba(255, 255, 255, 0.28);
    }

    #stationDragHandle:hover #dragHandlePill {
      background-color: rgba(148, 163, 184, 0.7);
      width: 3.5rem; /* 56px */
      transform: scaleY(1.2);
    }

    body.theme-dark #stationDragHandle:hover #dragHandlePill {
      background-color: rgba(255, 255, 255, 0.45);
    }

    #stationDragHandle.is-dragging #dragHandlePill,
    #dragHandlePill.is-active-drag {
      background-color: var(--aicher-blue) !important;
      width: 4.2rem !important; /* 67px */
      transform: scaleY(1.35) !important;
      box-shadow: 0 0 14px rgba(0, 102, 204, 0.65), inset 0 1px 1.5px rgba(255, 255, 255, 0.9) !important;
    }

    /* Smooth Dragging Class without Animation Stutter */
    .is-sheet-dragging #departuresList {
      transition: none !important;
    }
  </style>
</head>

<body class="theme-dark h-[100dvh] w-full fixed inset-0 overflow-hidden flex flex-col">

  <!-- Fullscreen Leaflet Container -->
  <div id="map"></div>

  <!-- Wayfinding Header & Search Bar -->
  <header class="absolute top-0 left-0 right-0 z-[1000] safe-top px-3 sm:px-4 pointer-events-none flex flex-col gap-2">
    <div class="pointer-events-auto max-w-xl mx-auto w-full">
      <div class="relative w-full">
        <div class="aicher-search-bar relative w-full flex items-center">
          <div class="pl-3.5 pr-1 flex items-center justify-center pointer-events-none text-[var(--aicher-text-muted)] z-10 leading-none shrink-0">

      const casingColor = isDark ? '#0B0E14' : '#FFFFFF';
      const casingOpacity = isDark ? 1.0 : 0.9;
      linePolylineElements.forEach(item => {
        if (item.casing) {
          item.casing.setStyle({ color: casingColor, opacity: casingOpacity });
        }
      });
    }

    function applyTileLayer(index) {
      if (activeTileLayer && map.hasLayer(activeTileLayer)) {
        map.removeLayer(activeTileLayer);
      }
      const theme = TILE_THEMES[index];
      activeTileLayer = L.tileLayer(theme.url, theme.options);
      activeTileLayer.addTo(map);

      const icon = document.getElementById('layerIcon');
      if (icon) icon.className = theme.iconClass;

      const isDark = (theme.id === 'dark');
      if (isDark) {
        document.body.classList.add('theme-dark');
      } else {
        document.body.classList.remove('theme-dark');
      }

      updateLineOutlines(isDark);
    }

    function getLineBadgesHTML(lines, compactOverride = null) {
      if (!lines || lines.length === 0) return '';
      const count = lines.length;
      
      let sizeClass = '';
      if (compactOverride === 'single' || (compactOverride === null && count === 1)) {
        sizeClass = 'min-w-[28px] h-[20px] text-[10.5px] px-2.5 rounded-full';
      } else if (compactOverride === 'compact' || count > 4) {
        sizeClass = 'min-w-[22px] h-[16px] text-[9px] px-1.5 rounded-full tracking-tight leading-none';
      } else {
        sizeClass = 'min-w-[25px] h-[18px] text-[9.5px] px-2 rounded-full leading-none';
      }

      return lines.map(line => {
        const bg = LINE_COLORS[line] || '#334155';
        const textClass = (line === 'S8') ? 'text-black' : 'text-white';
        return `<span class="inline-flex items-center justify-center font-black ${textClass} ${sizeClass} shadow-xs border border-white/40 shrink-0 transition-transform select-none aicher-badge" style="background-color: ${bg};">${line}</span>`;
      }).join('');
    }

    LINE_STACK_ORDER.forEach(lineCode => {
      if (!LINE_ROUTES[lineCode]) return;
      const coords = LINE_ROUTES[lineCode].map(id => [STATION_MAP[id].lat, STATION_MAP[id].lng]);
      if (coords.length > 1) {
        const isS = lineCode.startsWith('S');
        const color = LINE_COLORS[lineCode] || '#0066CC';
        const paneName = `pane_line_${lineCode}`;

        const casingWeight = isS ? 6.5 : 5.5;
        const coreWeight = isS ? 4.2 : 3.6;

        const isDark = document.body.classList.contains('theme-dark');
        const casing = L.polyline(coords, {
          pane: paneName,
          color: isDark ? '#0B0E14' : '#FFFFFF',
          weight: casingWeight + 2,
          opacity: isDark ? 1.0 : 0.9,
          lineJoin: 'round',
          lineCap: 'round',
          interactive: false
        });

        const core = L.polyline(coords, {
          pane: paneName,
          color: color,
          weight: coreWeight,
          opacity: 1.0,
          lineJoin: 'round',
          lineCap: 'round',
          interactive: false
        });

        lineLayerGroup.addLayer(casing);
        lineLayerGroup.addLayer(core);
        linePolylineElements.push({ lineCode, type: isS ? 'S' : 'U', casing, core });
      }
    });

    let userLocation = null;
    let userMarker = null;
    let accuracyCircle = null;
    let selectedStation = null;
    let watchId = null;
    let liveFetchController = null;

    let currentStationDepartures = [];
    let loadedDeparturesStationId = null;
    let currentFetchingStationId = null;
    let currentStationFilter = 'all';
    let currentSheetState = 1; // 1 = collapsed (peek), 2 = expanded

    // Sheet dimensions calibrated to uniform 42px row heights
    const COLLAPSED_HEIGHT = 84; // Exactly 2 visible rows
    function getExpandedHeight() {
      // Dynamic regulated height showing integer rows (5-7 rows)
      const count = Math.min(7, Math.max(5, Math.floor((window.innerHeight * 0.4) / 42)));
      return count * 42;
    }

    function setSheetState(state, withBounce = true) {
      currentSheetState = state === 2 ? 2 : 1;
      const listEl = document.getElementById('departuresList');
      const widget = document.getElementById('currentStationWidget');
      const pill = document.getElementById('dragHandlePill');

      if (pill) {
        pill.classList.remove('is-active-drag');
      }

      if (listEl) {
        listEl.style.transition = withBounce ? 'max-height 0.38s cubic-bezier(0.25, 1.15, 0.5, 1)' : 'none';
        if (currentSheetState === 1) {
          listEl.classList.remove('is-expanded');
          listEl.classList.add('is-collapsed');
          listEl.style.maxHeight = '';
          listEl.scrollTop = 0;
        } else {
          listEl.classList.remove('is-collapsed');
          listEl.classList.add('is-expanded');
          listEl.style.maxHeight = `${getExpandedHeight()}px`;
        }
      }

      if (widget) {
        if (withBounce) {
          widget.style.transition = 'transform 0.35s cubic-bezier(0.25, 1.25, 0.5, 1)';
        } else {
          widget.style.transition = 'none';
        }
        widget.style.transform = 'translateY(0px)';
        widget.style.opacity = '1';
      }
    }

    function dismissShelf() {
      const widget = document.getElementById('currentStationWidget');
      if (!widget) {
        deselectStation();
        return;
      }
      widget.style.transition = 'transform 0.28s cubic-bezier(0.25, 1, 0.5, 1)';
      widget.style.transform = 'translateY(115%)';
      widget.style.opacity = '1';
      if (navigator.vibrate) navigator.vibrate([10, 15]);
      setTimeout(() => {
        deselectStation();
      }, 280);
    }

    function toggleDeparturesExpanded() {
      setSheetState(currentSheetState === 1 ? 2 : 1, true);
      if (navigator.vibrate) navigator.vibrate(10);
    }

    (function setupDraggableShelfBar() {
      const dragHandle = document.getElementById('stationDragHandle');
      const headerArea = document.getElementById('stationHeaderArea');
      const listEl = document.getElementById('departuresList');
      const pill = document.getElementById('dragHandlePill');
      const widget = document.getElementById('currentStationWidget');

      if (!dragHandle || !listEl) return;

      let isDragging = false;
      let startSheetState = 1;
      let startY = 0;
      let startHeight = 0;
      let startTime = 0;
      let lastY = 0;
      let velocityY = 0;
      let lastMoveTime = 0;
      let activePointerId = null;

      function onPointerDown(e) {
        // Only respond to primary mouse click or touch contact
        if (e.button !== undefined && e.button !== 0) return;
        // Do not intercept interactive child buttons or badge links in header
        if (e.target.closest('button, .aicher-badge')) return;

        isDragging = true;
        startSheetState = currentSheetState;
        activePointerId = e.pointerId;
        startY = e.clientY;
        lastY = e.clientY;
        startTime = performance.now();
        lastMoveTime = startTime;
        velocityY = 0;

        // Capture starting height directly from rendered DOM
        const currentRectHeight = listEl.getBoundingClientRect().height;
        startHeight = currentRectHeight > 0 
          ? currentRectHeight 
          : (currentSheetState === 2 ? getExpandedHeight() : COLLAPSED_HEIGHT);

        // Immediate responsive visual feedback
        dragHandle.classList.add('is-dragging');
        if (pill) pill.classList.add('is-active-drag');
        document.body.classList.add('is-sheet-dragging');

        // Disable transitions during direct finger tracking for 0-latency tracking
        listEl.style.transition = 'none';
        if (widget) {
          widget.style.transition = 'none';
          widget.style.opacity = '1';
        }

        dragHandle.setPointerCapture(e.pointerId);

        window.addEventListener('pointermove', onPointerMove, { passive: false });
        window.addEventListener('pointerup', onPointerUp, { passive: false });
        window.addEventListener('pointercancel', onPointerUp, { passive: false });
      }

      function onPointerMove(e) {
        if (!isDragging || e.pointerId !== activePointerId) return;
        e.preventDefault();

        const currentY = e.clientY;
        const now = performance.now();
        const dt = Math.max(1, now - lastMoveTime);
        const dy = currentY - lastY;
        velocityY = (dy / dt);
        lastY = currentY;
        lastMoveTime = now;

        const deltaY = startY - currentY; // positive = dragging UP, negative = dragging DOWN
        let targetHeight = startHeight + deltaY;

        const maxH = getExpandedHeight();
        const minH = COLLAPSED_HEIGHT;

        if (targetHeight < minH) {
          // Pulling down past minimum collapsed height -> translate the whole shelf down solidly
          const pullDown = minH - targetHeight;
          listEl.style.maxHeight = `${minH}px`;
          if (widget) {
            widget.style.transform = `translateY(${pullDown}px)`;
            widget.style.opacity = '1';
          }
        } else if (targetHeight > maxH) {
          // Pulling up past maximum height -> rubberband resistance
          const overflow = targetHeight - maxH;
          listEl.style.maxHeight = `${maxH + (overflow * 0.28)}px`;
          if (widget) {
            widget.style.transform = 'translateY(0px)';
            widget.style.opacity = '1';
          }
        } else {
          // Sizing smoothly between collapsed and expanded states
          listEl.style.maxHeight = `${targetHeight}px`;
          if (widget) {
            widget.style.transform = 'translateY(0px)';
            widget.style.opacity = '1';
          }
        }
      }

      function onPointerUp(e) {
        if (!isDragging || e.pointerId !== activePointerId) return;

        window.removeEventListener('pointermove', onPointerMove);
        window.removeEventListener('pointerup', onPointerUp);
        window.removeEventListener('pointercancel', onPointerUp);

        try {
          if (dragHandle.hasPointerCapture(e.pointerId)) {
            dragHandle.releasePointerCapture(e.pointerId);
          }
        } catch (_) {}

        isDragging = false;
        activePointerId = null;

        dragHandle.classList.remove('is-dragging');
        if (pill) pill.classList.remove('is-active-drag');
        document.body.classList.remove('is-sheet-dragging');

        const totalDeltaY = startY - e.clientY;
        const totalDuration = performance.now() - startTime;
        const dragDownDistance = e.clientY - startY;
        const maxH = getExpandedHeight();
        const minH = COLLAPSED_HEIGHT;
        const currentHeight = listEl.getBoundingClientRect().height;

        // Quick tap detection without drag
        if (Math.abs(totalDeltaY) < 6 && totalDuration < 280) {
          toggleDeparturesExpanded();
          return;
        }

        // Pull-to-dismiss gesture handling
        if (startSheetState === 1) {
          // Started from collapsed state: pull down to dismiss threshold
          if (dragDownDistance > 45 || (dragDownDistance > 14 && velocityY > 0.35)) {
            dismissShelf();
            return;
          }
          let shouldExpand = (totalDeltaY > 40) || (velocityY < -0.32);
          setSheetState(shouldExpand ? 2 : 1, true);
        } else {
          // Started from expanded state: downward pull to collapsed or dismiss
          const excessDown = minH - (startHeight + totalDeltaY);
          if (excessDown > 45 || (excessDown > 12 && velocityY > 0.45) || (dragDownDistance > 160 && velocityY > 0.35)) {
            dismissShelf();
            return;
          }
          let shouldExpand = false;
          if (velocityY < -0.32) {
            shouldExpand = true;
          } else if (velocityY > 0.32) {
            shouldExpand = false;
          } else {
            const midPoint = (minH + maxH) / 2;
            shouldExpand = currentHeight >= midPoint;
          }
          setSheetState(shouldExpand ? 2 : 1, true);
        }

        if (navigator.vibrate) navigator.vibrate(10);
      }

      dragHandle.addEventListener('pointerdown', onPointerDown);
      headerArea.addEventListener('pointerdown', onPointerDown);
    })();

    async function fetchLiveDepartures(station, forceRefresh = false) {
      if (!station) return;
      const listEl = document.getElementById('departuresList');
      const dot = document.getElementById('depDataSourceDot');
      
      if (!forceRefresh && loadedDeparturesStationId === station.id && currentStationDepartures.length > 0) {
        applyDepartureFilter();
        return;
      }

      currentFetchingStationId = station.id;
      currentStationDepartures = [];
      loadedDeparturesStationId = null;

      renderDepartureFilterBar(station);

      if (dot) {
        dot.className = 'w-2.5 h-2.5 rounded-full bg-amber-400 shadow-sm animate-pulse shrink-0';
        dot.title = 'Verbinde Live-Daten...';
      }

      if (listEl) {
        listEl.innerHTML = `
          <div class="flex items-center justify-center py-4 gap-2 text-[var(--aicher-text-muted)]">
            <i class="fa-solid fa-circle-notch fa-spin text-xs"></i>
            <span class="text-[11px] font-bold uppercase tracking-wider leading-none">Lade Live-Abfahrten für ${station.name}...</span>
          </div>`;
      }

      if (liveFetchController) liveFetchController.abort();
      liveFetchController = new AbortController();
      const signal = liveFetchController.signal;

      let fetchedDepartures = [];

      // Tier 1: Local Serverless Proxy (/api/departures) querying MVG
      try {
        const cleanName = station.name.replace(/^München-/, '').trim();
        const apiPromise = fetch(`/api/departures?query=${encodeURIComponent(cleanName)}&lat=${station.lat}&lng=${station.lng}`, { signal });
        const apiRes = await Promise.race([
          apiPromise,
          new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 4200))
        ]);

        if (apiRes.ok) {
          const data = await apiRes.json();
          if (Array.isArray(data) && data.length > 0 && currentFetchingStationId === station.id) {
            fetchedDepartures = data;
          }
        }
      } catch (err) {
        // Fall through to public DB REST API
      }

      // Tier 2: Public DB HAFAS REST API fallback
      if (fetchedDepartures.length === 0 && currentFetchingStationId === station.id) {
        try {
          const strippedName = station.name.replace(/\s*\(.*?\)/g, '').replace(/^München-/, '').trim();
          
          // For Hauptbahnhof, query both the S-Bahn/DB terminal and the municipal U-Bahn station
          const searchQueries = (station.id === 'hbf')
            ? ['München Hbf', 'München Hbf (U-Bahn)']
            : [strippedName.includes('München') ? strippedName : `${strippedName} München`];

          const locPromises = searchQueries.map(q =>
            fetch(`https://v6.db.transport.rest/locations?query=${encodeURIComponent(q)}&results=5&poi=false&addresses=false`, { signal })
              .then(r => r.ok ? r.json() : [])
              .catch(() => [])
          );

          const locResults = await Promise.race([
            Promise.all(locPromises),
            new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 3800))
          ]);

          if (currentFetchingStationId === station.id) {
            const allLocs = locResults.flat();
            const stopIds = new Set();
            
            allLocs.forEach(loc => {
              if (loc && loc.id) stopIds.add(loc.id);
            });

            if (stopIds.size > 0) {
              const depPromises = Array.from(stopIds).slice(0, 4).map(id =>
                fetch(`https://v6.db.transport.rest/stops/${id}/departures?duration=50&results=30&bus=false&national=false&nationalExpress=false&regional=false`, { signal })
                  .then(r => r.ok ? r.json() : [])
                  .then(d => Array.isArray(d) ? d : (d.departures || []))
                  .catch(() => [])
              );

              const allResults = await Promise.race([
                Promise.all(depPromises),
                new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 4200))
              ]);

              if (currentFetchingStationId === station.id) {
                const rawList = allResults.flat();
                const now = new Date();
                const seenKeys = new Set();

                fetchedDepartures = rawList
                  .filter(d => d.line && (
                    d.line.product === 'subway' ||
                    d.line.product === 'suburban' ||
                    (d.line.name && (d.line.name.startsWith('U') || d.line.name.startsWith('S')))
                  ))
                  .filter(d => {
                    const key = d.tripId || `${d.line.name}-${d.direction}-${d.plannedWhen}`;
                    if (seenKeys.has(key)) return false;
                    seenKeys.add(key);
                    return true;
                  })
                  .map(dep => {
                    const expectedTime = new Date(dep.when || dep.plannedWhen);
                    const mins = Math.max(0, Math.round((expectedTime - now) / 60000));
                    let dir = dep.direction || 'Zentrum';
                    if (dir.startsWith('München ')) dir = dir.substring(8);
                    return {
                      line: dep.line.name.replace(/\s+/g, ''),
                      direction: dir,
                      minsUntil: mins,
                      scheduledTime: new Date(dep.plannedWhen),
                      delay: dep.delay ? Math.round(dep.delay / 60) : 0,
                      realtime: true
                    };
                  });
              }
            }
          }
        } catch (e) {
          // Handled below
        }
      }

      if (currentFetchingStationId !== station.id) return;

      if (fetchedDepartures.length > 0) {
        fetchedDepartures.sort((a, b) => a.minsUntil - b.minsUntil);
        updateDeparturesBoard(fetchedDepartures);
      } else {
        showDeparturesError(station, 'Keine Live-Abfahrten gefunden');
      }
    }

    const refreshDepBtn = document.getElementById('refreshDepBtn');
    if (refreshDepBtn) {
      refreshDepBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (selectedStation) fetchLiveDepartures(selectedStation, true);
      });
    }

    STATIONS.forEach(station => {
      const hubSvg = `<svg class="station-hub-svg" width="22" height="22" viewBox="0 0 22 22">
        <circle cx="11" cy="11" r="8" class="hub-outer"/>
        <circle cx="11" cy="11" r="3.2" class="hub-inner"/>
      </svg>`;

      const nodeSvg = `<svg class="station-node-svg" width="14" height="14" viewBox="0 0 14 14">
        <circle cx="7" cy="7" r="4.6" class="node-outer"/>
      </svg>`;

      const customIcon = L.divIcon({
        className: 'station-node-wrap',
        html: station.isHub ? hubSvg : nodeSvg,
        iconSize: station.isHub ? [22, 22] : [14, 14],
        iconAnchor: station.isHub ? [11, 11] : [7, 7]
      });

      const marker = L.marker([station.lat, station.lng], { icon: customIcon });

      const popupHtml = `
        <div class="flex flex-col items-center gap-1.5 px-3 py-2 max-w-[260px] text-center">
          <span class="text-[13px] font-black text-[var(--aicher-text-title)] tracking-tight leading-tight shrink-0">${station.name}</span>
          <div class="flex flex-wrap items-center justify-center gap-1.5">${getLineBadgesHTML(station.lines)}</div>
        </div>
      `;

      marker.bindPopup(popupHtml, {
        maxWidth: 280,
        offset: [0, -6],
        autoPanPaddingTopLeft: [20, 80],
        autoPanPaddingBottomRight: [20, 160],
        closeButton: false
      });

      marker.on('click', () => {
        setStationDisplay(station);
        if (navigator.vibrate) navigator.vibrate([14, 25, 18]);
      });

      stationLayerGroup.addLayer(marker);
      stationMarkers.push({ data: station, marker: marker });
    });

    function deselectStation() {
      selectedStation = null;
      loadedDeparturesStationId = null;
      currentStationDepartures = [];
      if (liveFetchController) {
        liveFetchController.abort();
        liveFetchController = null;
      }
      map.closePopup();
      const widget = document.getElementById('currentStationWidget');
      if (widget) {
        widget.classList.add('hidden');
        widget.style.transform = '';
        widget.style.opacity = '';
        widget.style.transition = '';
      }
    }

    const closeStationShelfBtn = document.getElementById('closeStationShelfBtn');
    if (closeStationShelfBtn) {
      closeStationShelfBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        dismissShelf();
      });
    }

    const ALL_U_LINES = ['U1', 'U2', 'U3', 'U4', 'U5', 'U6', 'U7', 'U8'];
    const ALL_S_LINES = ['S1', 'S2', 'S3', 'S4', 'S6', 'S7', 'S8', 'S20'];
    const ALL_LINES = [...ALL_U_LINES, ...ALL_S_LINES];
    const selectedLines = new Set();

    function updateActiveIndicators() {
      const isFiltered = selectedLines.size > 0;
      const filterBadge = document.getElementById('filterActiveBadge');
      if (filterBadge) {
        if (isFiltered) {
          filterBadge.innerText = selectedLines.size;
          filterBadge.classList.remove('hidden');
        } else {
          filterBadge.classList.add('hidden');
        }
      }
    }

    function updateFilterUI() {
      const isAll = (selectedLines.size === 0);
      const allUSelected = !isAll && ALL_U_LINES.every(l => selectedLines.has(l));
      const allSSelected = !isAll && ALL_S_LINES.every(l => selectedLines.has(l));

      const countEl = document.getElementById('filterActiveCount');
      if (countEl) {
        countEl.innerText = isAll ? '(Alle)' : `(${selectedLines.size} aktiv)`;
      }

      updateActiveIndicators();

      document.querySelectorAll('.filter-opt-btn').forEach(btn => {
        const f = btn.dataset.filter;
        if (f === 'all') {
          btn.classList.toggle('active-tab', isAll);
        } else if (f === 'U') {
          btn.classList.toggle('active-tab', allUSelected);
        } else if (f === 'S') {
          btn.classList.toggle('active-tab', allSSelected);
        }
      });

      document.querySelectorAll('.filter-line-btn').forEach(chip => {
        const line = chip.dataset.line;
        if (isAll) {
          chip.classList.remove('ring-2', 'ring-white', 'scale-105', 'opacity-35');
          chip.classList.add('opacity-100');
        } else {
          const isSelected = selectedLines.has(line);
          if (isSelected) {
            chip.classList.add('ring-2', 'ring-white', 'scale-105', 'opacity-100');
            chip.classList.remove('opacity-35');
          } else {
            chip.classList.remove('ring-2', 'ring-white', 'scale-105', 'opacity-100');
            chip.classList.add('opacity-35');
          }
        }
      });
    }

    function filterNetwork() {
      const isAll = (selectedLines.size === 0);
      linePolylineElements.forEach(item => {
        let isVisible = isAll || selectedLines.has(item.lineCode);
        if (isVisible) {
          if (!lineLayerGroup.hasLayer(item.casing)) lineLayerGroup.addLayer(item.casing);
          if (!lineLayerGroup.hasLayer(item.core)) lineLayerGroup.addLayer(item.core);
        } else {
          if (lineLayerGroup.hasLayer(item.casing)) lineLayerGroup.removeLayer(item.casing);
          if (lineLayerGroup.hasLayer(item.core)) lineLayerGroup.removeLayer(item.core);
        }
      });
      stationMarkers.forEach(sm => {
        let isVisible = isAll || sm.data.lines.some(l => selectedLines.has(l));
        if (isVisible) {
          if (!stationLayerGroup.hasLayer(sm.marker)) stationLayerGroup.addLayer(sm.marker);
        } else {
          if (stationLayerGroup.hasLayer(sm.marker)) stationLayerGroup.removeLayer(sm.marker);
        }
      });
    }

    const filterMenuBtn = document.getElementById('filterMenuBtn');
    const filterMenuPanel = document.getElementById('filterMenuPanel');
    const closeFilterMenuBtn = document.getElementById('closeFilterMenuBtn');
    
    function toggleFilterMenu(show) {
      const willShow = (show !== undefined) ? show : filterMenuPanel.classList.contains('hidden');
      if (willShow) {
        filterMenuPanel.classList.remove('hidden');
        filterMenuBtn.classList.add('scale-105');
      } else {
        filterMenuPanel.classList.add('hidden');
        filterMenuBtn.classList.remove('scale-105');
      }
    }

    if (filterMenuBtn) {
      filterMenuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleFilterMenu();
      });
    }

    if (closeFilterMenuBtn) {
      closeFilterMenuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleFilterMenu(false);
      });
    }

    const centerMapBtn = document.getElementById('centerMapBtn');
    if (centerMapBtn) {
      centerMapBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleFilterMenu(false);
        const lats = STATIONS.map(s => s.lat), lngs = STATIONS.map(s => s.lng);
        map.fitBounds(L.latLngBounds([Math.min(...lats), Math.min(...lngs)], [Math.max(...lats), Math.max(...lngs)]), { padding: [50, 25], animate: true });
        if (navigator.vibrate) navigator.vibrate(10);
      });
    }

    const layerCycleBtn = document.getElementById('layerCycleBtn');
    if (layerCycleBtn) {
      layerCycleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        currentTileIndex = (currentTileIndex === 0) ? 1 : 0;
        applyTileLayer(currentTileIndex);
        layerCycleBtn.blur();
        if (navigator.vibrate) navigator.vibrate(10);
      });
    }

    document.querySelectorAll('.filter-opt-btn').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        const f = this.dataset.filter;
        if (f === 'all') {
          selectedLines.clear();
        } else if (f === 'U') {
          const allUActive = ALL_U_LINES.every(l => selectedLines.has(l));
          if (allUActive) {
            ALL_U_LINES.forEach(l => selectedLines.delete(l));
          } else {
            ALL_U_LINES.forEach(l => selectedLines.add(l));
          }
          if (selectedLines.size === ALL_LINES.length) selectedLines.clear();
        } else if (f === 'S') {
          const allSActive = ALL_S_LINES.every(l => selectedLines.has(l));
          if (allSActive) {
            ALL_S_LINES.forEach(l => selectedLines.delete(l));
          } else {
            ALL_S_LINES.forEach(l => selectedLines.add(l));
          }
          if (selectedLines.size === ALL_LINES.length) selectedLines.clear();
        }
        updateFilterUI();
        filterNetwork();
      });
    });

    document.querySelectorAll('.filter-line-btn').forEach(chip => {
      chip.addEventListener('click', function(e) {
        e.stopPropagation();
        const line = this.dataset.line;
        if (selectedLines.has(line)) {
          selectedLines.delete(line);
        } else {
          selectedLines.add(line);
        }
        if (selectedLines.size === ALL_LINES.length) selectedLines.clear();
        updateFilterUI();
        filterNetwork();
      });
    });

    const searchInput = document.getElementById('stationSearchInput');
    const searchDropdown = document.getElementById('searchDropdown');
    const clearSearchBtn = document.getElementById('clearSearchBtn');

    searchInput.addEventListener('input', function() {
      const q = this.value.trim().toLowerCase();
      if (!q) { searchDropdown.classList.add('hidden'); clearSearchBtn.classList.add('hidden'); return; }
      clearSearchBtn.classList.remove('hidden');

      const matches = STATIONS.filter(s => s.name.toLowerCase().includes(q)).slice(0, 6);
      if (matches.length === 0) {
        searchDropdown.innerHTML = '<div class="p-4 text-[13px] text-[var(--aicher-text-muted)] font-semibold text-center">Keine Station gefunden</div>';
        searchDropdown.classList.remove('hidden'); return;
      }

      searchDropdown.innerHTML = matches.map(s => `
        <div data-id="${s.id}" class="search-row px-3.5 py-2.5 min-h-[46px] hover:bg-black/[0.04] dark:hover:bg-white/[0.06] cursor-pointer flex items-center justify-between gap-3 transition-colors">
          <div class="text-[13px] font-black text-[var(--aicher-text-title)] truncate leading-tight">${s.name}</div>
          <div class="flex items-center gap-1.5 shrink-0">${getLineBadgesHTML(s.lines, 'compact')}</div>
        </div>
      `).join('');

      searchDropdown.classList.remove('hidden');

      searchDropdown.querySelectorAll('.search-row').forEach(row => {
        row.addEventListener('click', function() {
          const stId = this.dataset.id;
          const found = stationMarkers.find(sm => sm.data.id === stId);
          if (found) {
            map.setView([found.data.lat, found.data.lng], 16, { animate: true });
            found.marker.openPopup();
            setStationDisplay(found.data);
          }
          searchDropdown.classList.add('hidden');
          searchInput.value = found.data.name;
          searchInput.blur();
        });
      });
    });

    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = ''; searchDropdown.classList.add('hidden'); clearSearchBtn.classList.add('hidden'); searchInput.focus();
    });

    map.on('click', () => {
      searchDropdown.classList.add('hidden');
      toggleFilterMenu(false);
      searchInput.blur();
      deselectStation();
    });

    function setStationDisplay(st, forceRefresh = false) {
      if (!st) return;

      const widget = document.getElementById('currentStationWidget');
      if (widget) {
        const wasHidden = widget.classList.contains('hidden');
        widget.classList.remove('hidden');

        if (wasHidden) {
          setSheetState(1, false);
          // Start positioned offscreen at full solid opacity (prevents browser composite alpha dropout)
          widget.style.transition = 'none';
          widget.style.transform = 'translateY(100%)';
          widget.style.opacity = '1';
          void widget.offsetHeight; // Force synchronous layout reflow
          // Animate with the identical spring curve used for drag release
          widget.style.transition = 'transform 0.36s cubic-bezier(0.25, 1.25, 0.5, 1)';
          widget.style.transform = 'translateY(0px)';
        } else {
          widget.style.transition = 'transform 0.24s cubic-bezier(0.25, 1.25, 0.5, 1)';
          widget.style.transform = 'translateY(0px)';
          widget.style.opacity = '1';
        }
      }

      const stationChanged = !selectedStation || selectedStation.id !== st.id;
      selectedStation = st;

      const lines = st.lines || [];
      const hasU = lines.some(l => l.startsWith('U'));
      const hasS = lines.some(l => l.startsWith('S'));
      if (currentStationFilter === 'U' && !hasU) currentStationFilter = 'all';
      if (currentStationFilter === 'S' && !hasS) currentStationFilter = 'all';

      const nameEl = document.getElementById('nearestStationName');
      if (nameEl) nameEl.innerText = st.name;
      
      const linesEl = document.getElementById('nearestStationLines');
      if (linesEl) {
        linesEl.innerHTML = getLineBadgesHTML(st.lines);
        linesEl.scrollLeft = 0;
      }
      
      const metaEl = document.getElementById('nearestStationMeta');
      if (metaEl) metaEl.innerText = st.zone || 'Zone M';

      if (stationChanged) {
        currentStationDepartures = [];
        loadedDeparturesStationId = null;
      }

      fetchLiveDepartures(st, forceRefresh || stationChanged);
    }

    function updateUserLocationOnMap(lat, lng, accuracy) {
      userLocation = { lat, lng };
      if (!userMarker) {
        const pulseIcon = L.divIcon({ className: 'aicher-gps-marker-wrap', html: '<div class="aicher-gps-wrap"><div class="aicher-gps-ring"></div><div class="aicher-gps-dot"></div></div>', iconSize: [32, 32], iconAnchor: [16, 16] });
        userMarker = L.marker([lat, lng], { icon: pulseIcon, zIndexOffset: 1000 }).addTo(map);
        accuracyCircle = L.circle([lat, lng], { radius: accuracy || 50, stroke: false, fillColor: '#0066CC', fillOpacity: 0.14 }).addTo(map);
      } else {
        userMarker.setLatLng([lat, lng]);
        accuracyCircle.setLatLng([lat, lng]);
        accuracyCircle.setRadius(accuracy || 50);
      }
    }

    function requestDeviceLocation(onSuccess, onError) {
      if (!('geolocation' in navigator)) return;
      navigator.geolocation.getCurrentPosition(
        pos => { updateUserLocationOnMap(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy); if (onSuccess) onSuccess(pos); },
        err => { if (onError) onError(err); },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 5000 }
      );
    }

    function startWatchingLocation() {
      if ('geolocation' in navigator && !watchId) {
        watchId = navigator.geolocation.watchPosition(
          pos => updateUserLocationOnMap(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy),
          err => console.warn('GPS continuous watch notice:', err.message),
          { enableHighAccuracy: true, maximumAge: 8000, timeout: 10000 }
        );
      }
    }

    const gpsBtn = document.getElementById('gpsBtn');
    const gpsIcon = document.getElementById('gpsIcon');

    if (gpsBtn) {
      gpsBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (navigator.vibrate) navigator.vibrate(10);

        // Immediately pan if location is already known
        if (userLocation) {
          map.setView([userLocation.lat, userLocation.lng], Math.max(map.getZoom(), 15), { animate: true });
        }

        // Brief loading indicator while querying fresh GPS coordinates
        if (gpsIcon) {
          gpsIcon.className = 'fa-solid fa-circle-notch fa-spin text-[12px] text-[var(--aicher-blue)]';
        }

        requestDeviceLocation(
          pos => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            map.setView([lat, lng], Math.max(map.getZoom(), 15), { animate: true });
            if (gpsIcon) {
              gpsIcon.className = 'fa-solid fa-location-crosshairs text-[13px] text-[var(--aicher-blue)]';
            }
          },
          () => {
            if (gpsIcon) {
              gpsIcon.className = 'fa-solid fa-location-crosshairs text-[13px] text-[var(--aicher-blue)]';
            }
          }
        );
      });
    }

    // Auto-refresh departures periodically when active
    let autoRefreshTimer = setInterval(() => {
      if (!document.hidden && selectedStation) {
        fetchLiveDepartures(selectedStation, true);
      }
    }, 30000);

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && selectedStation) {
        fetchLiveDepartures(selectedStation, true);
      }
    });

    requestDeviceLocation(() => startWatchingLocation(), () => {});

    setSheetState(1, false);
    applyTileLayer(0);

    function triggerMapResize() {
      if (map) {
        map.invalidateSize(true);
        if (!map.getCenter() || isNaN(map.getCenter().lat)) map.setView([48.140, 11.575], 13);
      }
    }
    window.addEventListener('resize', triggerMapResize);
    window.addEventListener('orientationchange', () => setTimeout(triggerMapResize, 200));
    window.addEventListener('load', triggerMapResize);
    if (window.ResizeObserver) { new ResizeObserver(() => triggerMapResize()).observe(document.getElementById('map')); }
  </script>
</body>
</html>
