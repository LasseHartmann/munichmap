  <script>
    function haptic(pattern = 15) {
      if (typeof navigator !== 'undefined' && navigator.vibrate) {
        try { navigator.vibrate(pattern); } catch(e){}
      }
    }

    const LINE_COLORS = {
      'U1': '#438238', 'U2': '#C31B2C', 'U3': '#EB7926', 'U4': '#00A896',
      'U5': '#BE7E22', 'U6': '#0073B9', 'U7': '#A32938', 'U8': '#B84514',
      'S1': '#1BB0E8', 'S2': '#74BF43', 'S3': '#92278F', 'S4': '#E2007A',
      'S5': '#00517F', 'S6': '#008B4E', 'S7': '#941B33', 'S8': '#FFCC00', 'S20': '#EA516D'
    };

    const ALL_U_LINES = ['U1', 'U2', 'U3', 'U4', 'U5', 'U6', 'U7', 'U8'];
    const ALL_S_LINES = ['S1', 'S2', 'S3', 'S4', 'S5', 'S6', 'S7', 'S8', 'S20'];
    const ALL_LINES = [...ALL_U_LINES, ...ALL_S_LINES];
    let activeMapLines = new Set(ALL_LINES);

    let STATIONS = []; 
    let STATION_MAP = {};
    const extractedByLine = {}; 
    ALL_LINES.forEach(l => { extractedByLine[l] = []; });

    const map = L.map('map', { 
      center: [48.140, 11.575], zoom: 13, minZoom: 9, maxZoom: 18, 
      zoomControl: false, tap: false, preferCanvas: true 
    });
    
    const lineLayerGroup = L.layerGroup().addTo(map);
    const stationLayerGroup = L.layerGroup().addTo(map);
    let linePolylineElements = []; 
    const stationMarkers = [];

    const MAPTILER_KEY = 'BnpNaJSc3Lm93aTkILvr';
    
    // Theme logic defaults to Dark Mode
    const TILE_THEMES = [
      { id: 'dark', url: `https://api.maptiler.com/maps/dataviz-dark/{z}/{x}/{y}.png?key=${MAPTILER_KEY}`, icon: 'fa-moon', color: 'text-[var(--aicher-yellow)]' },
      { id: 'light', url: `https://api.maptiler.com/maps/dataviz-light/{z}/{x}/{y}.png?key=${MAPTILER_KEY}`, icon: 'fa-sun', color: 'text-amber-500' }
    ];

    let currentTileIndex = 0; 
    let activeTileLayer = null;

    function applyTileLayer(index) {
      if (!TILE_THEMES.length) return;
      if (activeTileLayer) map.removeLayer(activeTileLayer);
      const theme = TILE_THEMES[index];
      activeTileLayer = L.tileLayer(theme.url, { tileSize: 512, zoomOffset: -1, minZoom: 1, maxZoom: 20 }).addTo(map);
      
      const isDark = (theme.id === 'dark');
      document.body.classList.toggle('theme-dark', isDark);
      document.getElementById('themeColorMeta').setAttribute('content', isDark ? '#2C2F36' : '#E0E5EC');
      document.getElementById('layerIcon').className = `fa-solid ${theme.icon} text-[13px] ${theme.color}`;
      
      linePolylineElements.forEach(item => {
        if (item.casing) item.casing.setStyle({ color: isDark ? '#2C2F36' : '#E0E5EC' });
      });
    }

    let currentDeparturesData = [];
    let activeDepartureFilters = new Set();
    let selectedStation = null;

    function getLineBadgesHTML(lines) {
      if (!lines || !lines.length) return '';
      return lines.map(line => {
        const bg = LINE_COLORS[line] || '#334155';
        const textClass = (line === 'S8') ? 'text-black' : 'text-white';
        return `<button data-dep-line="${line}" class="dep-filter-btn aicher-badge ${textClass}" style="background-color: ${bg};">${line}</button>`;
      }).join('');
    }

    // === GEOJSON PROCESSING RESTORED ===
    function matchMunichLine(feature) {
      const p = feature.properties || {};
      const ref = (p.ref || '').toUpperCase().trim();
      const name = (p.name || '').toUpperCase().trim();
      const lineProp = (p.line || '').toUpperCase().trim();

      if (ref.startsWith('RB') || ref.startsWith('RE') || ref.startsWith('ICE') || 
          ref.startsWith('IC') || ref.startsWith('ALX') || ref.startsWith('BRB') ||
          ref.startsWith('EC') || ref.startsWith('RJ')) {
        return null;
      }

      for (const lineCode of ALL_LINES) {
        const regex = new RegExp(`(^|[^A-Z0-9])${lineCode}([^0-9]|$)`, 'i');
        if (ref && regex.test(ref)) return lineCode;
        if (lineProp && regex.test(lineProp)) return lineCode;
        if (name && (name.includes(`${lineCode}:`) || name.includes(` ${lineCode} `) || name.endsWith(` ${lineCode}`))) {
          return lineCode;
        }
      }
      return null;
    }

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function extractLineStrings(geom) {
      if (!geom) return [];
      let lines = [];
      if (geom.type === 'LineString') {
        lines.push(geom.coordinates);
      } else if (geom.type === 'MultiLineString') {
        lines.push(...geom.coordinates);
      } else if (geom.type === 'GeometryCollection' && geom.geometries) {
        geom.geometries.forEach(g => {
          if (g.type === 'LineString') lines.push(g.coordinates);
          else if (g.type === 'MultiLineString') lines.push(...g.coordinates);
        });
      }
      return lines;
    }

    function renderTrackSegment(coords, lineCode) {
      if (!coords || coords.length < 2) return;
      const isS = lineCode.startsWith('S');
      const isDark = document.body.classList.contains('theme-dark');
      const casing = L.polyline(coords, { color: isDark ? '#2C2F36' : '#E0E5EC', weight: (isS ? 6.5 : 5.5) + 2, opacity: 1.0, interactive: false });
      const core = L.polyline(coords, { color: LINE_COLORS[lineCode] || '#0066CC', weight: isS ? 4.2 : 3.6, interactive: false });
      lineLayerGroup.addLayer(casing); lineLayerGroup.addLayer(core);
      linePolylineElements.push({ lineCode, casing, core });
    }

    function processAndApplyTracks(geojsonData) {
      if (!geojsonData || !Array.isArray(geojsonData.features)) return;
      ALL_LINES.forEach(l => { extractedByLine[l] = []; });
      geojsonData.features.forEach(feat => {
        const lineCode = matchMunichLine(feat);
        if (!lineCode) return;
        const rawList = extractLineStrings(feat.geometry);
        rawList.forEach(rawPts => {
          if (!rawPts || rawPts.length < 2) return;
          const p1 = rawPts[0];
          const p2 = rawPts[rawPts.length - 1];
          if (p1[0] === p2[0] && p1[1] === p2[1]) return; 
          let chunk = [];
          for (let p = 0; p < rawPts.length; p++) { chunk.push([rawPts[p][1], rawPts[p][0]]); }
          if (chunk.length > 1) { extractedByLine[lineCode].push(chunk); }
        });
      });
      ALL_LINES.forEach(lineCode => { extractedByLine[lineCode].forEach(seg => renderTrackSegment(seg, lineCode)); });
    }

    function processStations(geojsonData) {
      if (!geojsonData || !Array.isArray(geojsonData.features)) return;
      STATIONS = []; STATION_MAP = {};
      const tempStations = new Map();
      
      geojsonData.features.forEach(feat => {
        if (!feat.geometry || !feat.properties || !feat.properties.name) return;
        let lat, lng;
        if (feat.geometry.type === 'Point') {
          lat = feat.geometry.coordinates[1];
          lng = feat.geometry.coordinates[0];
        } else if (feat.geometry.type === 'Polygon') {
          const ring = feat.geometry.coordinates[0];
          let latSum = 0, lngSum = 0;
          ring.forEach(pt => { lngSum += pt[0]; latSum += pt[1]; });
          lat = latSum / ring.length;
          lng = lngSum / ring.length;
        } else return;

        let name = feat.properties.name.replace(/ \(.*\)/g, '').trim();
        
        // Normalize Hubs
        if (name.includes('Hauptbahnhof') || name.includes('München Hbf')) name = 'Hauptbahnhof';
        if (name.includes('Ostbahnhof')) name = 'Ostbahnhof';

        if (!tempStations.has(name)) {
          tempStations.set(name, { id: name.toLowerCase().replace(/[^a-z0-9]/g, '-'), name, lat, lng, lines: new Set(), isHub: false, zone: 'MVV' });
        }
      });

      tempStations.forEach(station => {
        for (const lineCode of ALL_LINES) {
          const segments = extractedByLine[lineCode] || [];
          let found = false;
          for (const seg of segments) {
            if (found) break;
            for (let i = 0; i < seg.length; i += 2) {
              const pt = seg[i];
              if (getDistanceMeters(station.lat, station.lng, pt[0], pt[1]) < 250) { 
                station.lines.add(lineCode);
                found = true; break;
              }
            }
          }
        }
        station.lines = Array.from(station.lines).sort();
        station.isHub = station.lines.length > 2 || (station.lines.some(l => l.startsWith('S')) && station.lines.some(l => l.startsWith('U')));
        
        if (station.lines.length > 0) {
          STATIONS.push(station);
          STATION_MAP[station.id] = station;
        }
      });
      renderStationMarkers();
    }

    function renderStationMarkers() {
      STATIONS.forEach(station => {
        const hubSvg = `<svg class="station-hub-svg" width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="8" class="hub-outer"/><circle cx="11" cy="11" r="3.2" class="hub-inner"/></svg>`;
        const nodeSvg = `<svg class="station-node-svg" width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="4.6" class="node-outer"/></svg>`;
        const customIcon = L.divIcon({ 
          className: 'station-node-wrap', 
          html: station.isHub ? hubSvg : nodeSvg, 
          iconSize: [44, 44], 
          iconAnchor: [22, 22] 
        });
        const marker = L.marker([station.lat, station.lng], { icon: customIcon });
        marker.on('click', () => { haptic(20); setStationDisplay(station); });
        stationLayerGroup.addLayer(marker);
        stationMarkers.push({ data: station, marker });
      });
    }

    async function loadNetworkTracks() {
      try {
        const cb = new Date().getTime(); 
        const [tracksRes, stationsRes] = await Promise.all([fetch(`tracks.geojson?v=${cb}`).catch(()=>null), fetch(`stations.geojson?v=${cb}`).catch(()=>null)]);
        
        if (!tracksRes || !tracksRes.ok || !stationsRes || !stationsRes.ok) {
            throw new Error("Missing Local Map Data");
        }
        
        const trackData = await tracksRes.json();
        processAndApplyTracks(trackData);
        
        const stData = await stationsRes.json();
        processStations(stData);

      } catch (err) { 
          showErrorToast("Kartendaten fehlen");
      }
    }

    // --- Search Logic ---
    let isSearchExpanded = false;
    let currentSearchMatches = [];
    const searchContainer = document.getElementById('searchContainer');
    const searchIconBtn = document.getElementById('searchIconBtn');
    const searchInput = document.getElementById('stationSearchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const searchDropdown = document.getElementById('searchDropdown');

    function toggleSearch() {
      isSearchExpanded = !isSearchExpanded;
      if (isSearchExpanded) {
        searchContainer.classList.remove('w-12');
        searchContainer.classList.add('w-[calc(100vw-24px)]', 'sm:w-80', 'neo-inset');
        searchContainer.classList.remove('bg-[var(--neo-base)]');
        searchInput.classList.remove('opacity-0', 'pointer-events-none');
        searchInput.focus();
      } else {
        searchContainer.classList.add('w-12', 'bg-[var(--neo-base)]');
        searchContainer.classList.remove('w-[calc(100vw-24px)]', 'sm:w-80', 'neo-inset');
        searchInput.classList.add('opacity-0', 'pointer-events-none');
        searchInput.value = '';
        searchDropdown.classList.add('hidden');
        clearSearchBtn.classList.add('hidden');
      }
    }

    searchIconBtn.addEventListener('click', () => { haptic(15); if (!isSearchExpanded) toggleSearch(); });
    clearSearchBtn.addEventListener('click', (e) => { e.stopPropagation(); haptic(15); toggleSearch(); });

    function renderSearchDropdown() {
      if (currentSearchMatches.length === 0) {
        searchDropdown.innerHTML = `<div class="px-4 py-3 text-[13px] font-semibold text-[var(--aicher-text-muted)]">Keine Stationen gefunden</div>`;
      } else {
        searchDropdown.innerHTML = currentSearchMatches.map(s => {
          return `
            <div class="px-4 py-3 cursor-pointer flex justify-between items-center transition-colors hover:bg-[var(--neo-shadow-light)]/20" onclick="selectSearchStation('${s.id}')">
              <span class="text-[13px] font-black text-[var(--aicher-text-title)]">${s.name}</span>
            </div>`;
        }).join('');
      }
      searchDropdown.classList.remove('hidden');
    }

    searchInput.addEventListener('input', function() {
      const q = this.value.trim().toLowerCase();
      if (!q) { searchDropdown.classList.add('hidden'); clearSearchBtn.classList.add('hidden'); return; }
      clearSearchBtn.classList.remove('hidden');
      currentSearchMatches = STATIONS.filter(s => s.name.toLowerCase().includes(q)).slice(0, 6);
      renderSearchDropdown();
    });

    window.selectSearchStation = function(stId) {
      haptic(20);
      const found = stationMarkers.find(sm => sm.data.id === stId);
      if (found) { map.setView([found.data.lat, found.data.lng], 16, { animate: true }); setStationDisplay(found.data); }
      toggleSearch();
    }

    // --- Drawer Logic ---
    const stationDrawer = document.getElementById('stationDrawer');

    function updateDepFiltersUI() {
      const btns = document.querySelectorAll('.dep-filter-btn');
      btns.forEach(btn => {
        const line = btn.getAttribute('data-dep-line');
        if (activeDepartureFilters.size === 0) {
          btn.style.opacity = '1'; btn.style.transform = '';
        } else if (activeDepartureFilters.has(line)) {
          btn.style.opacity = '1'; btn.style.transform = 'scale(1.1)';
        } else {
          btn.style.opacity = '0.35'; btn.style.transform = 'scale(0.95)';
        }
      });
      const clearBtn = document.getElementById('clearDepFiltersBtn');
      if (clearBtn) {
        if (activeDepartureFilters.size > 0) {
          clearBtn.classList.remove('hidden');
          requestAnimationFrame(() => clearBtn.classList.replace('scale-0', 'scale-100'));
        } else {
          clearBtn.classList.replace('scale-100', 'scale-0');
          setTimeout(() => { if (activeDepartureFilters.size === 0) clearBtn.classList.add('hidden'); }, 300);
        }
      }
    }

    function setStationDisplay(st) {
      selectedStation = st;
      activeDepartureFilters.clear();
      currentDeparturesData = [];

      document.getElementById('nearestStationName').innerText = st.name;
      const badgesHtml = getLineBadgesHTML(st.lines);
      const clearBtnHtml = `<button id="clearDepFiltersBtn" class="hidden neo-btn w-7 h-7 ml-auto shrink-0 transition-all duration-300 transform scale-0" title="Filter zurücksetzen"><i class="fa-solid fa-filter-circle-xmark text-[11px] text-[#C31B2C]"></i></button>`;
      
      const linesContainer = document.getElementById('nearestStationLines');
      linesContainer.innerHTML = badgesHtml + clearBtnHtml;

      linesContainer.querySelectorAll('.dep-filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          haptic(15);
          const line = btn.getAttribute('data-dep-line');
          activeDepartureFilters.has(line) ? activeDepartureFilters.delete(line) : activeDepartureFilters.add(line);
          updateDepFiltersUI(); renderDeparturesList(); 
        });
      });

      document.getElementById('clearDepFiltersBtn').addEventListener('click', () => {
        haptic([15, 30, 15]); activeDepartureFilters.clear(); updateDepFiltersUI(); renderDeparturesList();
      });

      stationDrawer.classList.remove('-translate-x-[150%]');
      fetchLiveDepartures(st);
    }

    document.getElementById('closeStationDrawerBtn').addEventListener('click', () => { 
        haptic(15); stationDrawer.classList.add('-translate-x-[150%]'); selectedStation = null;
    });

    document.getElementById('refreshDepBtn').addEventListener('click', () => {
      haptic([10, 40, 10]);
      if (selectedStation) fetchLiveDepartures(selectedStation);
    });

    // --- Departures List (Flexbox Layout) ---
    function renderDeparturesList() {
      const listEl = document.getElementById('departuresList');
      if (!currentDeparturesData || currentDeparturesData.length === 0) {
        listEl.innerHTML = `<div class="py-4 text-center text-[11px] text-[var(--aicher-text-muted)] font-bold">Aktuell keine Abfahrten gefunden.</div>`;
        return;
      }

      const filteredData = activeDepartureFilters.size > 0
        ? currentDeparturesData.filter(d => activeDepartureFilters.has(String(d.line)))
        : currentDeparturesData;

      if (filteredData.length === 0) {
        listEl.innerHTML = `<div class="py-4 text-center text-[11px] text-[var(--aicher-text-muted)] font-bold">Keine Abfahrten für gewählte Filter.</div>`;
        return;
      }

      listEl.innerHTML = filteredData.map(d => {
        const lineStr = String(d.line);
        const textColor = lineStr === 'S8' ? 'text-black' : 'text-white';
        const bgColor = LINE_COLORS[lineStr] || '#333333';
        const delayIndicator = d.delay > 0 ? `<span class="text-[#C31B2C] text-[10px] font-black ml-1">+${d.delay}</span>` : '';

        return `
          <div class="flex items-center justify-between p-2 hover:bg-[var(--neo-shadow-light)]/10 rounded-lg transition-colors min-w-0">
            <div class="flex items-center gap-2 flex-1 min-w-0 pr-2">
               <span class="aicher-badge flex items-center justify-center ${textColor} h-[20px] w-[32px] text-[10px] shrink-0" style="background-color: ${bgColor};">${lineStr}</span>
               <span class="text-[12px] font-bold truncate text-[var(--aicher-text-title)]">${d.direction}</span>
            </div>
            <span class="text-[12px] font-black text-[var(--aicher-text-title)] shrink-0 flex items-center w-[40px] justify-end">
              ${d.minsUntil}
              ${delayIndicator}
            </span>
          </div>
        `;
      }).join('');
    }

    async function fetchLiveDepartures(station) {
      const listEl = document.getElementById('departuresList');
      listEl.innerHTML = `<div class="py-4 text-center text-xs text-[var(--aicher-text-muted)] font-bold">Lade Live-Abfahrten...</div>`;
      
      try {
        const apiUrl = `/api/departures?query=${encodeURIComponent(station.name)}&lat=${station.lat}&lng=${station.lng}`;
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error('API-Fehler');
        
        currentDeparturesData = await response.json();
        renderDeparturesList();
      } catch (err) {
        console.warn("API Failed, falling back to mock data for demo");
        // Fallback for visual testing if API fails
        setTimeout(() => {
            currentDeparturesData = [
                { line: 'U1', direction: 'Olympia-Einkaufszentrum', minsUntil: 2, delay: 0 },
                { line: 'U2', direction: 'Feldmoching', minsUntil: 4, delay: 2 },
                { line: 'S8', direction: 'Flughafen München', minsUntil: 7, delay: 0 }
            ];
            renderDeparturesList();
        }, 500);
      }
    }

    // --- Notification & GPS UI ---
    let errorToastTimeout;
    function showErrorToast(msg) {
      const pill = document.getElementById('toastPill');
      document.getElementById('trackStatusMsg').innerText = msg;
      pill.classList.remove('translate-x-[150%]');
      if (errorToastTimeout) clearTimeout(errorToastTimeout);
      errorToastTimeout = setTimeout(() => pill.classList.add('translate-x-[150%]'), 4000);
    }

    const gpsStatusDot = document.getElementById('gpsStatusDot');
    let isTrackingGps = false;

    function startGpsTracking() {
        haptic(20);
        gpsStatusDot.classList.add('bg-yellow-500', 'animate-pulse');
        gpsStatusDot.classList.remove('bg-green-500', 'bg-red-500');

        setTimeout(() => {
            isTrackingGps = true;
            gpsStatusDot.classList.remove('bg-yellow-500', 'animate-pulse');
            gpsStatusDot.classList.add('bg-green-500');
            map.setView([48.140, 11.575], 16, { animate: true });
        }, 1500);
    }

    document.getElementById('gpsBtn').addEventListener('click', startGpsTracking);
    document.getElementById('layerCycleBtn').addEventListener('click', () => { 
        haptic(20); currentTileIndex = (currentTileIndex + 1) % TILE_THEMES.length; applyTileLayer(currentTileIndex); 
    });
    
    document.getElementById('centerMapBtn').addEventListener('click', () => { 
        haptic(20); map.setView([48.140, 11.575], 11, {animate:true}); 
    });

    // --- Filter logic ---
    const filterMenuBtn = document.getElementById('filterMenuBtn');
    const filterMenuPanel = document.getElementById('filterMenuPanel');
    
    filterMenuBtn.addEventListener('click', (e) => { 
      e.stopPropagation(); haptic(15); 
      filterMenuPanel.classList.toggle('hidden'); 
      filterMenuBtn.classList.toggle('neo-inset-sm'); 
    });
    
    document.getElementById('closeFilterMenuBtn').addEventListener('click', () => { 
      haptic(15); filterMenuPanel.classList.add('hidden'); filterMenuBtn.classList.remove('neo-inset-sm'); 
    });

    applyTileLayer(0);
    loadNetworkTracks();
  </script>
</body>
</html>
