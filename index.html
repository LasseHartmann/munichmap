<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Munich Zone M Transit GPS Map</title>
  <meta name="theme-color" content="#0B0E14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet Map CSS & JS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #EAF0F8;
    }

    :root {
      /* Luminous Liquid Glass Theme - Light */
      --aicher-bg: #EAF0F8;
      --glass-base: rgba(255, 255, 255, 0.62);
      --glass-base-solid: #FFFFFF;
      --glass-panel-sub: rgba(244, 248, 255, 0.50);
      --glass-border: rgba(255, 255, 255, 0.78);
      --glass-border-focus: rgba(255, 255, 255, 0.95);
      --glass-specular: rgba(255, 255, 255, 0.95);
      --glass-specular-soft: rgba(255, 255, 255, 0.55);
      --glass-blur: blur(26px) saturate(190%);
      --glass-shadow: 0 16px 44px -8px rgba(0, 85, 185, 0.16), 0 6px 18px -4px rgba(15, 23, 42, 0.06);
      --glass-btn-hover-shadow: 0 12px 28px -4px rgba(0, 102, 204, 0.26);
      --aicher-blue: #0066CC;
      --aicher-yellow: #FFB800;
      --aicher-green: #00A35C;
      --aicher-text-title: #0F172A;
      --aicher-text-main: #1E293B;
      --aicher-text-muted: #5B6E88;
      --aicher-radius: 28px;
      --aicher-radius-pill: 9999px;
      --spring-bouncy: cubic-bezier(0.34, 1.68, 0.64, 1);
      --spring-squish: cubic-bezier(0.175, 0.885, 0.32, 1.45);
      --spring-soft: cubic-bezier(0.25, 1.25, 0.5, 1);
    }

    body.theme-dark {
      /* Luminous Liquid Glass Theme - Dark */
      --aicher-bg: #0B0E14;
      --glass-base: rgba(15, 22, 35, 0.65);
      --glass-base-solid: #121824;
      --glass-panel-sub: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.18);
      --glass-border-focus: rgba(255, 255, 255, 0.35);
      --glass-specular: rgba(255, 255, 255, 0.28);
      --glass-specular-soft: rgba(255, 255, 255, 0.14);
      --glass-shadow: 0 20px 48px -8px rgba(0, 0, 0, 0.78), 0 6px 18px rgba(0, 0, 0, 0.45);
      --glass-btn-hover-shadow: 0 12px 30px -4px rgba(0, 0, 0, 0.6);
      --aicher-blue: #1A84ED;
      --aicher-yellow: #FFD200;
      --aicher-green: #00B368;
      --aicher-text-title: #FFFFFF;
      --aicher-text-main: #E5EBF5;
      --aicher-text-muted: #94A3B8;
    }

    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Univers", "SF Pro Display", "Helvetica Neue", "Arial", sans-serif;
      overscroll-behavior: none;
      background-color: var(--aicher-bg);
      color: var(--aicher-text-main);
      letter-spacing: -0.015em;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    #map {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--aicher-bg);
      z-index: 1;
      touch-action: manipulation;
    }

    .aicher-panel {
      position: relative;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.72) 0%, rgba(240, 246, 255, 0.55) 100%);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1.5px solid var(--glass-border);
      border-radius: var(--aicher-radius);
      box-shadow: inset 0 1.5px 2px 0 var(--glass-specular),
                  inset 0 -1.5px 2px 0 rgba(0, 0, 0, 0.03),
                  var(--glass-shadow);
      transition: transform 0.42s var(--spring-bouncy),
                  box-shadow 0.35s ease,
                  background 0.35s ease,
                  border-color 0.3s ease;
    }

    body.theme-dark .aicher-panel {
      background: linear-gradient(135deg, rgba(16, 23, 38, 0.72) 0%, rgba(10, 15, 26, 0.62) 100%);
      box-shadow: inset 0 1.5px 2px 0 var(--glass-specular),
                  inset 0 -2px 3px 0 rgba(0, 0, 0, 0.35),
                  var(--glass-shadow);
    }

    .aicher-btn {
      position: relative;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 0;
      margin: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.72) 0%, rgba(240, 246, 255, 0.52) 100%);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1.5px solid var(--glass-border);
      border-radius: 14px;
      color: var(--aicher-text-title);
      box-shadow: inset 0 1.5px 2px 0 var(--glass-specular),
                  inset 0 -1px 1.5px 0 rgba(0, 0, 0, 0.04),
                  var(--glass-shadow);
      transition: transform 0.28s var(--spring-bouncy),
                  box-shadow 0.25s ease,
                  background-color 0.2s ease,
                  border-color 0.2s ease;
      touch-action: manipulation;
      will-change: transform;
      line-height: 1 !important;
      text-align: center !important;
    }

    body.theme-dark .aicher-btn {
      background: linear-gradient(135deg, rgba(22, 30, 48, 0.70) 0%, rgba(12, 18, 30, 0.58) 100%);
      box-shadow: inset 0 1.5px 2px 0 var(--glass-specular),
                  inset 0 -2px 3px 0 rgba(0, 0, 0, 0.3),
                  var(--glass-shadow);
    }

    .aicher-btn:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: inset 0 1.5px 2px 0 var(--glass-specular),
                  var(--glass-btn-hover-shadow);
      border-color: var(--glass-border-focus);
    }

    .aicher-btn:active {
      transform: scale(0.88, 0.85) translateY(1px);
      box-shadow: inset 0 1px 1px 0 var(--glass-specular),
                  0 2px 8px rgba(0, 70, 160, 0.2);
      transition: transform 0.12s var(--spring-squish);
    }

    .aicher-search-bar {
      position: relative;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.70) 0%, rgba(240, 246, 255, 0.56) 100%);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1.5px solid var(--glass-border);
      border-radius: 22px;
      box-shadow: inset 0 1.5px 2px 0 var(--glass-specular),
                  inset 0 -1.5px 2px 0 rgba(0, 0, 0, 0.04),
                  var(--glass-shadow);
    }

    body.theme-dark .aicher-search-bar {
      background: linear-gradient(135deg, rgba(18, 25, 42, 0.70) 0%, rgba(11, 16, 28, 0.60) 100%);
      box-shadow: inset 0 1.5px 2px 0 var(--glass-specular),
                  inset 0 -2px 3px 0 rgba(0, 0, 0, 0.3),
                  var(--glass-shadow);
    }

    .aicher-bottom-shelf {
      position: relative;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.72) 0%, rgba(240, 246, 255, 0.58) 100%);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1.5px solid var(--glass-border);
      border-radius: 22px;
      box-shadow: inset 0 2px 2.5px 0 var(--glass-specular),
                  inset 0 -1.5px 2px 0 rgba(0, 0, 0, 0.04),
                  var(--glass-shadow);
    }

    body.theme-dark .aicher-bottom-shelf {
      background: linear-gradient(135deg, rgba(16, 23, 38, 0.72) 0%, rgba(10, 15, 26, 0.62) 100%);
      box-shadow: inset 0 1.5px 2px 0 var(--glass-specular),
                  inset 0 -2px 3px 0 rgba(0, 0, 0, 0.35),
                  var(--glass-shadow);
    }

    .aicher-filter-tab {
      background: var(--glass-panel-sub);
      backdrop-filter: var(--glass-blur);
      border: 1.5px solid var(--glass-border);
      border-radius: var(--aicher-radius-pill);
      color: var(--aicher-text-main);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      transition: all 0.36s var(--spring-bouncy);
    }

    .aicher-filter-tab.active-tab {
      background: var(--aicher-blue) !important;
      border-color: rgba(255, 255, 255, 0.6) !important;
      color: #FFFFFF !important;
      transform: scale(1.04);
    }

    .aicher-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      border-radius: var(--aicher-radius-pill);
      min-width: 30px;
      height: 22px;
      padding: 0 8px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.35), 0 2px 5px rgba(0, 0, 0, 0.15);
      transition: transform 0.32s var(--spring-bouncy);
    }

    .aicher-badge:hover {
      transform: scale(1.12, 1.08) translateY(-1.5px);
    }

    .station-node-wrap.leaflet-div-icon, .station-node-wrap {
      background: transparent !important; border: none !important;
      display: flex !important; align-items: center !important; justify-content: center !important;
      transition: transform 0.3s var(--spring-bouncy);
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.5));
    }
    .station-node-wrap:hover {
      transform: scale(1.25);
    }

    .station-node-svg circle.node-outer {
      fill: #FFFFFF; stroke: #0F172A; stroke-width: 2.2px;
    }
    .station-hub-svg circle.hub-outer {
      fill: #FFFFFF; stroke: #0F172A; stroke-width: 2.4px;
    }
    .station-hub-svg circle.hub-inner {
      fill: #0F172A;
    }

    body.theme-dark .station-node-svg circle.node-outer {
      fill: #101726; stroke: #FFFFFF; stroke-width: 2.2px;
    }
    body.theme-dark .station-hub-svg circle.hub-outer {
      fill: #101726; stroke: #FFFFFF; stroke-width: 2.4px;
    }
    body.theme-dark .station-hub-svg circle.hub-inner {
      fill: #FFFFFF;
    }

    /* Leaflet Popup Liquid Glass Theme */
    .leaflet-popup-content-wrapper {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.74) 0%, rgba(240, 246, 255, 0.58) 100%) !important;
      backdrop-filter: var(--glass-blur) !important;
      -webkit-backdrop-filter: var(--glass-blur) !important;
      border: 1.5px solid var(--glass-border) !important;
      border-radius: 20px !important;
      box-shadow: inset 0 1.5px 2px 0 var(--glass-specular),
                  0 16px 36px -6px rgba(0, 60, 140, 0.18) !important;
      color: var(--aicher-text-title) !important;
      padding: 4px 6px !important;
    }
    .leaflet-popup-content { margin: 0 !important; line-height: 1.35 !important; }
    .leaflet-popup-tip {
      background: rgba(255, 255, 255, 0.75) !important;
      backdrop-filter: var(--glass-blur) !important;
      border: 1px solid var(--glass-border) !important;
    }

    body.theme-dark .leaflet-popup-content-wrapper {
      background: linear-gradient(135deg, rgba(16, 23, 38, 0.78) 0%, rgba(10, 15, 26, 0.68) 100%) !important;
      border-color: rgba(255, 255, 255, 0.22) !important;
      box-shadow: inset 0 1.5px 2px 0 rgba(255, 255, 255, 0.32), 0 20px 48px -6px rgba(0, 0, 0, 0.75) !important;
      color: #FFFFFF !important;
    }
    body.theme-dark .leaflet-popup-tip {
      background: rgba(14, 20, 34, 0.78) !important;
      border-color: rgba(255, 255, 255, 0.22) !important;
    }

    .aicher-gps-marker-wrap.leaflet-div-icon { background: transparent !important; border: none !important; }
    .aicher-gps-wrap { position: relative; width: 32px; height: 32px; }
    .aicher-gps-dot {
      width: 16px; height: 16px; background: var(--aicher-blue); border: 3px solid #FFFFFF;
      border-radius: 50%; position: absolute; top: 8px; left: 8px;
      box-shadow: 0 4px 14px rgba(0, 102, 204, 0.8);
      animation: jellyPulse 3s infinite var(--spring-bouncy);
    }
    .aicher-gps-ring {
      position: absolute; inset: 0px; border: 2px solid rgba(255, 255, 255, 0.75); border-radius: 50%;
      opacity: 0.85; animation: aicherPing 2.2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    @keyframes aicherPing { 75%, 100% { transform: scale(2.8); opacity: 0; } }
    @keyframes jellyPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15, 0.9); }
    }

    .safe-top { padding-top: max(14px, env(safe-area-inset-top, 14px)); }
    .safe-bottom { padding-bottom: max(16px, env(safe-area-inset-bottom, 16px)); }

    #departuresList.is-collapsed { max-height: 84px; overflow-y: hidden; }
    #departuresList.is-expanded { max-height: 294px; overflow-y: auto; }
  </style>
</head>

<body class="theme-dark h-[100dvh] w-full fixed inset-0 overflow-hidden flex flex-col">

  <div id="map"></div>

  <!-- Header & Search Bar -->
  <header class="absolute top-0 left-0 right-0 z-[1000] safe-top px-3 sm:px-4 pointer-events-none flex flex-col gap-2">
    <div class="pointer-events-auto max-w-xl mx-auto w-full">
      <div class="relative w-full">
        <div class="aicher-search-bar relative w-full flex items-center">
          <div class="pl-3.5 pr-1 flex items-center justify-center pointer-events-none text-[var(--aicher-text-muted)] z-10 leading-none shrink-0">
            <i class="fa-solid fa-magnifying-glass text-[13px] opacity-80"></i>
          </div>
          <input id="stationSearchInput" type="text" placeholder="Station in Zone M suchen..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" class="w-full bg-transparent border-none outline-none py-2.5 pr-8 leading-tight text-[15px] sm:text-sm text-[var(--aicher-text-title)] font-semibold placeholder:text-[var(--aicher-text-muted)]">
          <button id="clearSearchBtn" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 w-6 h-6 rounded-full bg-[var(--glass-panel-sub)] border border-[var(--glass-border)] flex items-center justify-center opacity-85 hover:opacity-100">
            <i class="fa-solid fa-xmark text-[10px] text-[var(--aicher-text-title)]"></i>
          </button>
        </div>
        <div id="searchDropdown" class="hidden absolute top-full left-0 right-0 mt-2 max-h-[42vh] overflow-y-auto aicher-panel divide-y divide-[var(--glass-border)] z-50 overflow-hidden shadow-2xl"></div>
      </div>
    </div>

    <!-- Active Routing Toast Badge -->
    <div id="trackStatusToast" class="hidden pointer-events-auto mx-auto aicher-panel px-3.5 py-1.5 flex items-center gap-2 text-[11px] font-black tracking-tight text-[var(--aicher-text-title)] shadow-lg transition-all duration-300">
      <span class="w-2 h-2 rounded-full bg-[var(--aicher-green)] animate-ping"></span>
      <span id="trackStatusMsg">Gleise optimiert auf Zone M</span>
    </div>

    <!-- Filter Menu Panel -->
    <div id="filterMenuPanel" class="hidden pointer-events-auto aicher-panel p-4 max-w-xl mx-auto w-full mt-1 z-50">
      <div class="flex items-center justify-between pb-3 mb-3 border-b border-[var(--glass-border)]">
        <div class="flex items-center gap-2.5">
          <div class="w-6 h-6 rounded-full bg-[var(--aicher-blue)] flex items-center justify-center text-white shadow-sm shrink-0 leading-none">
            <i class="fa-solid fa-sliders text-[10px]"></i>
          </div>
          <span class="text-[11px] font-black uppercase tracking-wider text-[var(--aicher-text-title)]">Linienfilter</span>
          <span id="filterActiveCount" class="text-[10px] font-bold text-[var(--aicher-text-muted)] ml-1"></span>
        </div>
        <button id="closeFilterMenuBtn" class="w-7 h-7 rounded-full bg-[var(--glass-panel-sub)] border border-[var(--glass-border)] flex items-center justify-center opacity-85 hover:opacity-100">
          <i class="fa-solid fa-xmark text-xs text-[var(--aicher-text-title)]"></i>
        </button>
      </div>
      <div class="grid grid-cols-3 gap-2 mb-4">
        <button data-filter="all" class="filter-opt-btn aicher-filter-tab active-tab px-3 py-2 text-xs flex items-center justify-center">Alle</button>
        <button data-filter="U" class="filter-opt-btn aicher-filter-tab px-3 py-2 text-xs flex items-center justify-center">
          <span class="w-5 h-5 rounded-[6px] bg-[#0073B9] text-white text-xs font-black flex items-center justify-center">U</span>
        </button>
        <button data-filter="S" class="filter-opt-btn aicher-filter-tab px-3 py-2 text-xs flex items-center justify-center">
          <span class="w-5 h-5 rounded-full bg-[#008B4E] text-white text-xs font-black flex items-center justify-center">S</span>
        </button>
      </div>
      <div class="mb-3.5">
        <span class="text-[10px] font-black uppercase tracking-wider text-[var(--aicher-text-muted)] flex items-center gap-1.5 mb-2 pl-1">
          <span class="w-3.5 h-3.5 rounded-[4px] bg-[#0073B9] text-white text-[9px] font-black inline-flex items-center justify-center">U</span> U-Bahn Linien
        </span>
        <div class="flex flex-wrap gap-2">
          <button data-line="U1" class="filter-line-btn aicher-badge text-white bg-[#438238]">U1</button>
          <button data-line="U2" class="filter-line-btn aicher-badge text-white bg-[#C31B2C]">U2</button>
          <button data-line="U3" class="filter-line-btn aicher-badge text-white bg-[#EB7926]">U3</button>
          <button data-line="U4" class="filter-line-btn aicher-badge text-white bg-[#00A896]">U4</button>
          <button data-line="U5" class="filter-line-btn aicher-badge text-white bg-[#BE7E22]">U5</button>
          <button data-line="U6" class="filter-line-btn aicher-badge text-white bg-[#0073B9]">U6</button>
          <button data-line="U7" class="filter-line-btn aicher-badge text-white bg-[#A32938]">U7</button>
          <button data-line="U8" class="filter-line-btn aicher-badge text-white bg-[#B84514]">U8</button>
        </div>
      </div>
      <div>
        <span class="text-[10px] font-black uppercase tracking-wider text-[var(--aicher-text-muted)] flex items-center gap-1.5 mb-2 pl-1">
          <span class="w-3.5 h-3.5 rounded-full bg-[#008B4E] text-white text-[9px] font-black inline-flex items-center justify-center">S</span> S-Bahn Linien
        </span>
        <div class="flex flex-wrap gap-2">
          <button data-line="S1" class="filter-line-btn aicher-badge text-white bg-[#1BB0E8]">S1</button>
          <button data-line="S2" class="filter-line-btn aicher-badge text-white bg-[#74BF43]">S2</button>
          <button data-line="S3" class="filter-line-btn aicher-badge text-white bg-[#92278F]">S3</button>
          <button data-line="S4" class="filter-line-btn aicher-badge text-white bg-[#E2007A]">S4</button>
          <button data-line="S6" class="filter-line-btn aicher-badge text-white bg-[#008B4E]">S6</button>
          <button data-line="S7" class="filter-line-btn aicher-badge text-white bg-[#941B33]">S7</button>
          <button data-line="S8" class="filter-line-btn aicher-badge text-black bg-[#FFCC00]">S8</button>
          <button data-line="S20" class="filter-line-btn aicher-badge text-white bg-[#EA516D]">S20</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Side Floating Controls -->
  <aside class="absolute right-3 top-[68px] sm:top-20 z-[1000] flex flex-col gap-2 pointer-events-auto">
    <button id="gpsBtn" title="Standort auf Karte zentrieren" class="w-9 h-9 aicher-btn shadow-md">
      <i id="gpsIcon" class="fa-solid fa-location-crosshairs text-[13px] text-[var(--aicher-blue)]"></i>
    </button>
    <button id="filterMenuBtn" title="Linienfilter anzeigen" class="w-9 h-9 aicher-btn relative shadow-md">
      <i id="filterBtnIcon" class="fa-solid fa-filter text-[12px] text-[var(--aicher-text-title)]"></i>
      <span id="filterActiveBadge" class="hidden absolute -top-1 -right-1 min-w-[16px] h-[16px] px-1 rounded-full bg-[var(--aicher-blue)] text-[8.5px] font-black text-white flex items-center justify-center">0</span>
    </button>
    <button id="centerMapBtn" title="Gesamtes Netz zentrieren" class="w-9 h-9 aicher-btn shadow-md">
      <i class="fa-solid fa-expand text-[12px] text-[var(--aicher-text-title)] opacity-90"></i>
    </button>
    <button id="layerCycleBtn" title="Kartenstil umschalten" class="w-9 h-9 aicher-btn shadow-md">
      <i id="layerIcon" class="fa-solid fa-moon text-[12.5px] text-[var(--aicher-yellow)]"></i>
    </button>
  </aside>

  <!-- Bottom Drawer for Station Details & Live Departures -->
  <div id="currentStationWidget" class="hidden absolute bottom-3 left-3 right-3 sm:left-auto sm:right-4 sm:w-[410px] max-w-md mx-auto z-[1000] safe-bottom pointer-events-auto">
    <div class="aicher-bottom-shelf p-3 sm:px-3.5 sm:py-3 flex flex-col max-w-full min-w-[285px]">
      
      <div id="stationDragHandle" class="w-full flex flex-col items-center justify-center py-2.5 -mt-1 group cursor-pointer">
        <div id="dragHandlePill" class="w-12 h-1.5 rounded-full bg-slate-400/40 group-hover:bg-[var(--aicher-blue)] transition-all"></div>
      </div>

      <div id="stationHeaderArea" class="flex items-center justify-between gap-2.5 sm:gap-3 min-w-0 w-full cursor-pointer select-none">
        <div class="flex flex-col min-w-[105px] max-w-[44%] shrink-0">
          <span id="nearestStationName" class="text-[14px] leading-tight font-black truncate text-[var(--aicher-text-title)]">Hauptbahnhof</span>
          <span id="nearestStationMeta" class="text-[10px] leading-tight text-[var(--aicher-text-muted)] font-semibold">Zone M</span>
        </div>

      const lineProp = (feature.properties?.line || '').toUpperCase().trim();

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function projectPointOnSegment(px, py, ax, ay, bx, by) {
      const dx = bx - ax;
      const dy = by - ay;
      if (dx === 0 && dy === 0) return { x: ax, y: ay, t: 0 };
      const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy)));
      return { x: ax + t * dx, y: ay + t * dy, t: t };
    }

    /**
     * Graph Track Router:
     * - Takes GeoJSON features
     * - Builds an in-memory topological graph
     * - Routes strictly from station[i] -> station[i+1] along GeoJSON track geometry
     * - Reduces dual tracks into one path
     * - Truncates all tracks extending past Zone M terminal stations
     */
    class MunichTrackGraphRouter {
      constructor(geojsonData) {
        this.features = geojsonData.features || [];
        this.allLineStrings = [];
        this.extractAllLineStrings();
      }

      extractAllLineStrings() {
        this.features.forEach(feat => {
          if (!feat.geometry || !feat.geometry.coordinates) return;
          const type = feat.geometry.type;
          if (type === 'LineString') {
            this.allLineStrings.push({ coords: feat.geometry.coordinates, feat });
          } else if (type === 'MultiLineString') {
            feat.geometry.coordinates.forEach(seg => {
              this.allLineStrings.push({ coords: seg, feat });
            });
          }
        });
      }

      buildLineTrackNetwork(lineCode) {
        const routeStations = LINE_ROUTES[lineCode];
        if (!routeStations || routeStations.length < 2) return null;

        const stationPoints = routeStations.map(id => STATION_MAP[id]).filter(Boolean);
        if (stationPoints.length < 2) return null;

        // Bounding box of the line's Zone M stations with a safe margin (~1.5 km)
        let minLat = 90, maxLat = -90, minLng = 180, maxLng = -180;
        stationPoints.forEach(st => {
          if (st.lat < minLat) minLat = st.lat;
          if (st.lat > maxLat) maxLat = st.lat;
          if (st.lng < minLng) minLng = st.lng;
          if (st.lng > maxLng) maxLng = st.lng;
        });
        const margin = 0.02; // ~2km margin
        minLat -= margin; maxLat += margin; minLng -= margin; maxLng += margin;

        // Select candidate segments: matches line tag OR general railway in bbox
        let candidateSegments = this.allLineStrings.filter(item => {
          return isTrackForLine(item.feat, lineCode);
        });

        // Fallback: If no feature explicitly has the line name tag, search nearby railway tracks
        if (candidateSegments.length === 0) {
          candidateSegments = this.allLineStrings.filter(item => {
            const c = item.coords[0];
            const lat = c[1], lng = c[0];
            return lat >= minLat && lat <= maxLat && lng >= minLng && lng <= maxLng;
          });
        }

        if (candidateSegments.length === 0) return null;

        // Spatial Node Quantization
        const SNAP_SCALE = 100000; // ~1 meter precision
        const nodes = new Map(); // id -> { lat, lng }
        const adj = new Map();   // id -> [{ to, weight, coords }]

        function getNodeId(lat, lng) {
          const k = `${Math.round(lat * SNAP_SCALE / 2) * 2}_${Math.round(lng * SNAP_SCALE / 2) * 2}`;
          if (!nodes.has(k)) {
            nodes.set(k, { id: k, lat, lng });
            adj.set(k, []);
          }
          return k;
        }

        candidateSegments.forEach(seg => {
          const pts = seg.coords;
          if (!pts || pts.length < 2) return;

          for (let i = 0; i < pts.length - 1; i++) {
            const p1 = pts[i], p2 = pts[i+1];
            const lat1 = p1[1], lng1 = p1[0];
            const lat2 = p2[1], lng2 = p2[0];

            // Exclude segments completely outside Zone M bounding box to strip Bavarian suburbs
            if ((lat1 < minLat && lat2 < minLat) || (lat1 > maxLat && lat2 > maxLat) ||
                (lng1 < minLng && lng2 < minLng) || (lng1 > maxLng && lng2 > maxLng)) {
              continue;
            }

            const u = getNodeId(lat1, lng1);
            const v = getNodeId(lat2, lng2);
            if (u === v) continue;

            const dist = getDistanceMeters(lat1, lng1, lat2, lng2);
            adj.get(u).push({ to: v, weight: dist, coords: [[lat1, lng1], [lat2, lng2]] });
            adj.get(v).push({ to: u, weight: dist, coords: [[lat2, lng2], [lat1, lng1]] });
          }
        });

        if (nodes.size === 0) return null;

        // Helper: Find closest node to a station
        function findClosestNode(stLat, stLng) {
          let closestId = null;
          let minDist = Infinity;
          for (const [id, node] of nodes.entries()) {
            const d = getDistanceMeters(stLat, stLng, node.lat, node.lng);
            if (d < minDist) {
              minDist = d;
              closestId = id;
            }
          }
          return { id: closestId, dist: minDist };
        }

        // A* Pathfinding between two graph nodes
        function findShortestPath(startId, goalId) {
          if (startId === goalId) return [];

          const goalNode = nodes.get(goalId);
          const openSet = new Set([startId]);
          const cameFrom = new Map();
          const gScore = new Map([[startId, 0]]);
          const fScore = new Map([[startId, getDistanceMeters(nodes.get(startId).lat, nodes.get(startId).lng, goalNode.lat, goalNode.lng)]]);

          while (openSet.size > 0) {
            // Find node with lowest fScore
            let current = null;
            let lowestF = Infinity;
            for (const n of openSet) {
              const f = fScore.get(n) || Infinity;
              if (f < lowestF) {
                lowestF = f;
                current = n;
              }
            }

            if (current === goalId) {
              // Reconstruct path coordinates
              const pathCoords = [];
              let curr = goalId;
              while (cameFrom.has(curr)) {
                const edge = cameFrom.get(curr);
                pathCoords.unshift(...edge.coords.slice(1));
                curr = edge.from;
              }
              const startCoords = [nodes.get(startId).lat, nodes.get(startId).lng];
              pathCoords.unshift(startCoords);
              return pathCoords;
            }

            openSet.delete(current);
            const currG = gScore.get(current);

            const neighbors = adj.get(current) || [];
            for (const edge of neighbors) {
              const neighbor = edge.to;
              const tentativeG = currG + edge.weight;

              if (tentativeG < (gScore.get(neighbor) || Infinity)) {
                cameFrom.set(neighbor, { from: current, coords: edge.coords });
                gScore.set(neighbor, tentativeG);
                const h = getDistanceMeters(nodes.get(neighbor).lat, nodes.get(neighbor).lng, goalNode.lat, goalNode.lng);
                fScore.set(neighbor, tentativeG + h);
                openSet.add(neighbor);
              }
            }
          }

          // If no connected track path (e.g., small gap in OSM data), connect directly
          const n1 = nodes.get(startId), n2 = nodes.get(goalId);
          return [[n1.lat, n1.lng], [n2.lat, n2.lng]];
        }

        // Route continuously through each sequential station pair
        const synthesizedPath = [];

        for (let i = 0; i < stationPoints.length - 1; i++) {
          const stA = stationPoints[i];
          const stB = stationPoints[i + 1];

          const snapA = findClosestNode(stA.lat, stA.lng);
          const snapB = findClosestNode(stB.lat, stB.lng);

          if (!snapA.id || !snapB.id) continue;

          // Connect from station pin cleanly to track, follow track, then connect to next station pin
          const subPath = findShortestPath(snapA.id, snapB.id);

          if (i === 0) {
            synthesizedPath.push([stA.lat, stA.lng]);
          }

          subPath.forEach(pt => {
            const last = synthesizedPath[synthesizedPath.length - 1];
            if (!last || last[0] !== pt[0] || last[1] !== pt[1]) {
              synthesizedPath.push(pt);
            }
          });

          synthesizedPath.push([stB.lat, stB.lng]);
        }

        return (synthesizedPath.length >= 2) ? synthesizedPath : null;
      }
    }

    function applySynthesizedGeoJSONTracks(geojsonData) {
      if (!geojsonData || !Array.isArray(geojsonData.features)) return;

      const router = new MunichTrackGraphRouter(geojsonData);
      let replacedCount = 0;
      const replacedLines = new Set();

      ALL_LINES.forEach(lineCode => {
        const consolidatedCoords = router.buildLineTrackNetwork(lineCode);
        if (consolidatedCoords && consolidatedCoords.length > 2) {
          // Remove old polyline elements for this line
          linePolylineElements = linePolylineElements.filter(item => {
            if (item.lineCode === lineCode) {
              lineLayerGroup.removeLayer(item.casing);
              lineLayerGroup.removeLayer(item.core);
              return false;
            }
            return true;
          });

          // Render optimized single consolidated corridor strictly bounded in Zone M
          renderTrackSegment(consolidatedCoords, lineCode);
          replacedCount++;
          replacedLines.add(lineCode);
        }
      });

      if (replacedCount > 0) {
        filterNetwork();
        showToast(`Zone M Trassen berechnet: ${replacedCount} Linien optimiert (Gleise vereint)`);
      }
    }

    async function loadNetworkTracks() {
      const candidatePaths = [
        '/tracks.geojson',
        'tracks.geojson',
        './tracks.geojson',
        '/public/tracks.geojson',
        'public/tracks.geojson'
      ];

      for (const path of candidatePaths) {
        try {
          const res = await fetch(path);
          if (res.ok) {
            const data = await res.json();
            applySynthesizedGeoJSONTracks(data);
            console.log(`Tracks GeoJSON erfolgreich geladen & auf Zone M konsolidiert: ${path}`);
            return;
          }
        } catch (_) {}
      }
      console.log('Keine tracks.geojson im Webroot gefunden (Basisschienen aktiv).');
    }

    STATIONS.forEach(station => {
      const hubSvg = `<svg class="station-hub-svg" width="22" height="22" viewBox="0 0 22 22">
        <circle cx="11" cy="11" r="8" class="hub-outer"/>
        <circle cx="11" cy="11" r="3.2" class="hub-inner"/>
      </svg>`;

      const nodeSvg = `<svg class="station-node-svg" width="14" height="14" viewBox="0 0 14 14">
        <circle cx="7" cy="7" r="4.6" class="node-outer"/>
      </svg>`;

      const customIcon = L.divIcon({
        className: 'station-node-wrap',
        html: station.isHub ? hubSvg : nodeSvg,
        iconSize: station.isHub ? [22, 22] : [14, 14],
        iconAnchor: station.isHub ? [11, 11] : [7, 7]
      });

      const marker = L.marker([station.lat, station.lng], { icon: customIcon });

      const popupHtml = `
        <div class="flex flex-col items-center gap-1.5 px-3 py-2 max-w-[260px] text-center">
          <span class="text-[13px] font-black text-[var(--aicher-text-title)] tracking-tight leading-tight shrink-0">${station.name}</span>
          <div class="flex flex-wrap items-center justify-center gap-1.5">${getLineBadgesHTML(station.lines)}</div>
        </div>
      `;

      marker.bindPopup(popupHtml, {
        maxWidth: 280,
        offset: [0, -6],
        closeButton: false
      });

      marker.on('click', () => {
        setStationDisplay(station);
      });

      stationLayerGroup.addLayer(marker);
      stationMarkers.push({ data: station, marker: marker });
    });

    let selectedStation = null;
    let currentSheetState = 1;

    function setSheetState(state, withBounce = true) {
      currentSheetState = state === 2 ? 2 : 1;
      const listEl = document.getElementById('departuresList');
      const widget = document.getElementById('currentStationWidget');

      if (listEl) {
        if (currentSheetState === 1) {
          listEl.classList.remove('is-expanded');
          listEl.classList.add('is-collapsed');
          listEl.scrollTop = 0;
        } else {
          listEl.classList.remove('is-collapsed');
          listEl.classList.add('is-expanded');
        }
      }

      if (widget) {
        widget.style.transition = withBounce ? 'transform 0.35s cubic-bezier(0.25, 1.25, 0.5, 1)' : 'none';
        widget.style.transform = 'translateY(0px)';
      }
    }

    function dismissShelf() {
      const widget = document.getElementById('currentStationWidget');
      if (!widget) { deselectStation(); return; }
      widget.style.transition = 'transform 0.28s cubic-bezier(0.25, 1, 0.5, 1)';
      widget.style.transform = 'translateY(115%)';
      setTimeout(() => deselectStation(), 280);
    }

    function deselectStation() {
      selectedStation = null;
      map.closePopup();
      const widget = document.getElementById('currentStationWidget');
      if (widget) {
        widget.classList.add('hidden');
        widget.style.transform = '';
      }
    }

    function setStationDisplay(st) {
      if (!st) return;
      const widget = document.getElementById('currentStationWidget');
      if (widget) {
        widget.classList.remove('hidden');
        setSheetState(1, false);
      }
      selectedStation = st;

      const nameEl = document.getElementById('nearestStationName');
      if (nameEl) nameEl.innerText = st.name;
      const linesEl = document.getElementById('nearestStationLines');
      if (linesEl) linesEl.innerHTML = getLineBadgesHTML(st.lines);
      const metaEl = document.getElementById('nearestStationMeta');
      if (metaEl) metaEl.innerText = st.zone || 'Zone M';

      fetchLiveDepartures(st);
    }

    async function fetchLiveDepartures(station) {
      const listEl = document.getElementById('departuresList');
      if (listEl) {
        listEl.innerHTML = `<div class="py-4 text-center text-xs text-[var(--aicher-text-muted)] font-bold">Lade Abfahrten...</div>`;
      }
      try {
        const cleanName = station.name.replace(/^München-/, '').trim();
        const res = await fetch(`/api/departures?query=${encodeURIComponent(cleanName)}&lat=${station.lat}&lng=${station.lng}`);
        if (!res.ok) throw new Error('API offline');
        const deps = await res.json();
        
        if (!deps || deps.length === 0) {
          listEl.innerHTML = `<div class="py-4 text-center text-xs text-[var(--aicher-text-muted)]">Keine Abfahrten in den nächsten Minuten.</div>`;
          return;
        }

        listEl.innerHTML = deps.slice(0, 16).map(d => `
          <div class="h-[42px] min-h-[42px] grid grid-cols-[48px_1fr_86px] items-center px-3">
            <span class="aicher-badge text-white h-[20px] min-w-[32px] px-1.5 text-[10px] font-black" style="background-color: ${LINE_COLORS[d.line] || '#334155'};">${d.line}</span>
            <span class="text-[13px] font-bold truncate text-[var(--aicher-text-title)] pl-1">${d.direction}</span>
            <span class="text-right text-[12.5px] font-black text-[var(--aicher-text-title)]">${d.minsUntil} <span class="text-[10px] text-[var(--aicher-text-muted)] font-normal">min</span></span>
          </div>
        `).join('');
      } catch (e) {
        // Fallback simulated departures based on station lines
        const mocked = [];
        station.lines.forEach((line, idx) => {
          mocked.push({
            line,
            direction: line.startsWith('U') ? 'Zentrum / Messe / Sendling' : 'Ostbahnhof / Pasing / Hbf',
            minsUntil: (idx * 3 + 2)
          });
          mocked.push({
            line,
            direction: line.startsWith('U') ? 'Nord / Olympia / Feldmoching' : 'Hauptbahnhof / Stammstrecke',
            minsUntil: (idx * 3 + 8)
          });
        });
        mocked.sort((a,b) => a.minsUntil - b.minsUntil);

        listEl.innerHTML = mocked.slice(0, 8).map(d => `
          <div class="h-[42px] min-h-[42px] grid grid-cols-[48px_1fr_86px] items-center px-3">
            <span class="aicher-badge text-white h-[20px] min-w-[32px] px-1.5 text-[10px] font-black" style="background-color: ${LINE_COLORS[d.line] || '#334155'};">${d.line}</span>
            <span class="text-[12.5px] font-bold truncate text-[var(--aicher-text-title)] pl-1">${d.direction}</span>
            <span class="text-right text-[12px] font-black text-[var(--aicher-text-title)]">${d.minsUntil} <span class="text-[10px] text-[var(--aicher-text-muted)] font-normal">min</span></span>
          </div>
        `).join('');
      }
    }

    document.getElementById('stationDragHandle').addEventListener('click', () => {
      setSheetState(currentSheetState === 1 ? 2 : 1, true);
    });
    document.getElementById('stationHeaderArea').addEventListener('click', () => {
      setSheetState(currentSheetState === 1 ? 2 : 1, true);
    });
    document.getElementById('closeStationShelfBtn').addEventListener('click', dismissShelf);
    document.getElementById('refreshDepBtn').addEventListener('click', () => {
      if (selectedStation) fetchLiveDepartures(selectedStation);
    });

    function updateActiveIndicators() {
      const isFiltered = selectedLines.size > 0;
      const filterBadge = document.getElementById('filterActiveBadge');
      if (filterBadge) {
        if (isFiltered) {
          filterBadge.innerText = selectedLines.size;
          filterBadge.classList.remove('hidden');
        } else {
          filterBadge.classList.add('hidden');
        }
      }
    }

    function updateFilterUI() {
      const isAll = (selectedLines.size === 0);
      const allUSelected = !isAll && ALL_U_LINES.every(l => selectedLines.has(l));
      const allSSelected = !isAll && ALL_S_LINES.every(l => selectedLines.has(l));

      const countEl = document.getElementById('filterActiveCount');
      if (countEl) countEl.innerText = isAll ? '(Alle)' : `(${selectedLines.size} aktiv)`;

      updateActiveIndicators();

      document.querySelectorAll('.filter-opt-btn').forEach(btn => {
        const f = btn.dataset.filter;
        if (f === 'all') btn.classList.toggle('active-tab', isAll);
        else if (f === 'U') btn.classList.toggle('active-tab', allUSelected);
        else if (f === 'S') btn.classList.toggle('active-tab', allSSelected);
      });

      document.querySelectorAll('.filter-line-btn').forEach(chip => {
        const line = chip.dataset.line;
        if (isAll) {
          chip.classList.remove('ring-2', 'ring-white', 'scale-105', 'opacity-35');
          chip.classList.add('opacity-100');
        } else {
          const isSelected = selectedLines.has(line);
          chip.classList.toggle('ring-2', isSelected);
          chip.classList.toggle('ring-white', isSelected);
          chip.classList.toggle('scale-105', isSelected);
          chip.classList.toggle('opacity-35', !isSelected);
          chip.classList.toggle('opacity-100', isSelected);
        }
      });
    }

    function filterNetwork() {
      const isAll = (selectedLines.size === 0);
      linePolylineElements.forEach(item => {
        let isVisible = isAll || selectedLines.has(item.lineCode);
        if (isVisible) {
          if (!lineLayerGroup.hasLayer(item.casing)) lineLayerGroup.addLayer(item.casing);
          if (!lineLayerGroup.hasLayer(item.core)) lineLayerGroup.addLayer(item.core);
        } else {
          if (lineLayerGroup.hasLayer(item.casing)) lineLayerGroup.removeLayer(item.casing);
          if (lineLayerGroup.hasLayer(item.core)) lineLayerGroup.removeLayer(item.core);
        }
      });
      stationMarkers.forEach(sm => {
        let isVisible = isAll || sm.data.lines.some(l => selectedLines.has(l));
        if (isVisible) {
          if (!stationLayerGroup.hasLayer(sm.marker)) stationLayerGroup.addLayer(sm.marker);
        } else {
          if (stationLayerGroup.hasLayer(sm.marker)) stationLayerGroup.removeLayer(sm.marker);
        }
      });
    }

    const filterMenuBtn = document.getElementById('filterMenuBtn');
    const filterMenuPanel = document.getElementById('filterMenuPanel');
    const closeFilterMenuBtn = document.getElementById('closeFilterMenuBtn');
    
    function toggleFilterMenu(show) {
      const willShow = (show !== undefined) ? show : filterMenuPanel.classList.contains('hidden');
      filterMenuPanel.classList.toggle('hidden', !willShow);
    }

    if (filterMenuBtn) filterMenuBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleFilterMenu(); });
    if (closeFilterMenuBtn) closeFilterMenuBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleFilterMenu(false); });

    document.querySelectorAll('.filter-opt-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const f = this.dataset.filter;
        if (f === 'all') selectedLines.clear();
        else if (f === 'U') {
          const allUActive = ALL_U_LINES.every(l => selectedLines.has(l));
          allUActive ? ALL_U_LINES.forEach(l => selectedLines.delete(l)) : ALL_U_LINES.forEach(l => selectedLines.add(l));
        } else if (f === 'S') {
          const allSActive = ALL_S_LINES.every(l => selectedLines.has(l));
          allSActive ? ALL_S_LINES.forEach(l => selectedLines.delete(l)) : ALL_S_LINES.forEach(l => selectedLines.add(l));
        }
        updateFilterUI();
        filterNetwork();
      });
    });

    document.querySelectorAll('.filter-line-btn').forEach(chip => {
      chip.addEventListener('click', function() {
        const line = this.dataset.line;
        selectedLines.has(line) ? selectedLines.delete(line) : selectedLines.add(line);
        updateFilterUI();
        filterNetwork();
      });
    });

    // Station Search
    const searchInput = document.getElementById('stationSearchInput');
    const searchDropdown = document.getElementById('searchDropdown');
    const clearSearchBtn = document.getElementById('clearSearchBtn');

    searchInput.addEventListener('input', function() {
      const q = this.value.trim().toLowerCase();
      if (!q) { searchDropdown.classList.add('hidden'); clearSearchBtn.classList.add('hidden'); return; }
      clearSearchBtn.classList.remove('hidden');

      const matches = STATIONS.filter(s => s.name.toLowerCase().includes(q)).slice(0, 6);
      if (matches.length === 0) {
        searchDropdown.innerHTML = '<div class="p-4 text-[13px] text-[var(--aicher-text-muted)] font-semibold text-center">Keine Station gefunden</div>';
        searchDropdown.classList.remove('hidden'); return;
      }

      searchDropdown.innerHTML = matches.map(s => `
        <div data-id="${s.id}" class="search-row px-3.5 py-2.5 min-h-[46px] hover:bg-black/[0.04] dark:hover:bg-white/[0.06] cursor-pointer flex items-center justify-between gap-3">
          <div class="text-[13px] font-black text-[var(--aicher-text-title)] truncate">${s.name}</div>
          <div class="flex items-center gap-1.5 shrink-0">${getLineBadgesHTML(s.lines, 'compact')}</div>
        </div>
      `).join('');

      searchDropdown.classList.remove('hidden');

      searchDropdown.querySelectorAll('.search-row').forEach(row => {
        row.addEventListener('click', function() {
          const stId = this.dataset.id;
          const found = stationMarkers.find(sm => sm.data.id === stId);
          if (found) {
            map.setView([found.data.lat, found.data.lng], 16, { animate: true });
            found.marker.openPopup();
            setStationDisplay(found.data);
          }
          searchDropdown.classList.add('hidden');
          searchInput.value = found.data.name;
        });
      });
    });

    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = ''; searchDropdown.classList.add('hidden'); clearSearchBtn.classList.add('hidden');
    });

    map.on('click', () => {
      searchDropdown.classList.add('hidden');
      toggleFilterMenu(false);
      deselectStation();
    });

    let userMarker = null;
    let gpsWatchId = null;

    document.getElementById('gpsBtn').addEventListener('click', () => {
      if (!navigator.geolocation) {
        showToast('GPS auf diesem Gerät nicht verfügbar');
        return;
      }
      showToast('Ortung aktiv...');
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          if (!userMarker) {
            const gpsIcon = L.divIcon({
              className: 'aicher-gps-marker-wrap',
              html: `<div class="aicher-gps-wrap"><div class="aicher-gps-ring"></div><div class="aicher-gps-dot"></div></div>`,
              iconSize: [32, 32],
              iconAnchor: [16, 16]
            });
            userMarker = L.marker([lat, lng], { icon: gpsIcon, zIndexOffset: 1000 }).addTo(map);
          } else {
            userMarker.setLatLng([lat, lng]);
          }
          map.setView([lat, lng], 15, { animate: true });
          showToast('Standort zentriert');
        },
        (err) => {
          showToast('GPS Signal nicht erreichbar');
        },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    });

    document.getElementById('centerMapBtn').addEventListener('click', () => {
      const lats = STATIONS.map(s => s.lat), lngs = STATIONS.map(s => s.lng);
      map.fitBounds(L.latLngBounds([Math.min(...lats), Math.min(...lngs)], [Math.max(...lats), Math.max(...lngs)]), { padding: [50, 25], animate: true });
    });

    document.getElementById('layerCycleBtn').addEventListener('click', () => {
      currentTileIndex = (currentTileIndex === 0) ? 1 : 0;
      applyTileLayer(currentTileIndex);
    });

    function showToast(msg) {
      const toast = document.getElementById('trackStatusToast');
      const text = document.getElementById('trackStatusMsg');
      if (toast && text) {
        text.innerText = msg;
        toast.classList.remove('hidden');
        setTimeout(() => toast.classList.add('hidden'), 4500);
      }
    }

    applyTileLayer(0);
    loadNetworkTracks();
  </script>
</body>
</html>
